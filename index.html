      </section>
      <section class="block"><h3>备注</h3><p class="note ${b.note ? '' : 'empty'}">${esc(b.note) || '还没有备注'}</p></section>
      <div class="actions">
        <button class="btn primary" data-act="edit-book" data-id="${esc(b.id)}">编辑</button>
        <button class="btn danger" data-act="del-book" data-id="${esc(b.id)}">删除</button>
      </div>
    </div>`;
}

/* ================= 统计 ================= */
/* ================= 统计配色主题 =================
   默认配色 + 用户上传图片提取的配色。所有颜色在显示前都会按当前背景自动加深/提亮，保证看得清。 */
const DEFAULT_THEME = {id: 'default', name: '默认', colors: ['#4e79a7', '#e08e45', '#59a14f', '#d1605e', '#8c6bb1', '#c9a227', '#3fa3b0', '#a0785a']};
let USER_THEMES = [];   // [{id, name, colors: [hex × 8]}]
let THEME = 'default';
const themeOf = id => USER_THEMES.find(t => t.id === id) || DEFAULT_THEME;
const rgbOf = hex => { const n = parseInt(String(hex).replace('#', ''), 16) || 0; return [n >> 16, (n >> 8) & 255, n & 255]; };
const hexOf = c => '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
function luminance([r, g, b]) { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); }
function contrastOf(a, b) { const x = luminance(a), y = luminance(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function pageBg() { const m = (getComputedStyle(document.body).backgroundColor || '').match(/\d+/g); return m ? m.slice(0, 3).map(Number) : [255, 255, 255]; }
/* 图形颜色和背景的对比度至少 3:1；不够就往黑（浅色背景）或往白（深色背景）推 */
function rgbToHsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h / 6, s, l];
}
function hslToRgb([h, s, l]) {
  if (!s) return [l * 255, l * 255, l * 255];
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255];
}
/* 保持色相，只调亮度（必要时略提饱和度），直到和背景的对比度够看清 */
function fitColor(hex, bg, min = 3) {
  let [h, sat, l] = rgbToHsl(rgbOf(hex)); const dark = luminance(bg) < 0.4;
  for (let i = 0; i < 30 && contrastOf(hslToRgb([h, sat, l]), bg) < min; i++) {
    l = dark ? Math.min(0.95, l + 0.025) : Math.max(0.08, l - 0.025);
    if (sat > 0.08) sat = Math.min(0.85, sat * 1.04);
  }
  return hexOf(hslToRgb([h, sat, l]));
}
const textOnHex = hex => contrastOf(rgbOf(hex), [255, 255, 255]) >= contrastOf(rgbOf(hex), [28, 30, 36]) ? '#fff' : '#1c1e24';
const themeColors = () => { const t = themeOf(THEME).colors.slice(0, 8); while (t.length < 8) t.push(DEFAULT_THEME.colors[t.length]); return t; };
const pal = i => fitColor(themeColors()[((i % 8) + 8) % 8], pageBg());
const themeVars = () => themeColors().map((c, i) => { const f = fitColor(c, pageBg()); return `--p${i + 1}:${f};--p${i + 1}-ink:${textOnHex(f)}`; }).join(';');

let statYear = null, statMetric = 'count', statAll = {ip: false, cp: false};
function sumBy(books, keyFn) {   // 按本数（含购买数量）汇总
  const m = new Map();
  books.forEach(b => (keyFn(b) || []).forEach(k => { const e = m.get(k) || {name: k, count: 0, cost: 0, titles: 0}; e.count += qtyOf(b); e.cost += bookTotal(b); e.titles++; m.set(k, e); }));
  return [...m.values()].sort((a, b) => b.count - a.count || b.cost - a.cost);
}
/* 小标题：色点 + 名称 + 右侧补充说明 */
const blockHead = (title, n, aside) => `<div class="sb-head"><h3><i style="--c:var(--p${n})"></i>${title}</h3>${aside ? `<span>${aside}</span>` : ''}</div>`;
function barRows(rows, {valFn, color, limit, moreKey}) {
  const shown = limit && !statAll[moreKey] ? rows.slice(0, limit) : rows;
  const m = Math.max(1, ...rows.map(r => r.v));
  return `<ol class="sb-bars">${shown.map(r => `<li>
      <div class="sb-row"><span class="sb-name">${esc(r.name)}${r.sub ? `<em>${esc(r.sub)}</em>` : ''}</span><span class="sb-val">${valFn(r)}</span></div>
      <div class="sb-track"><i style="--c:${color};width:${Math.max(1.5, r.v / m * 100)}%"></i></div></li>`).join('')}</ol>
    ${limit && rows.length > limit ? `<button class="sb-more" data-act="stat-more" data-v="${moreKey}">${statAll[moreKey] ? '收起' : `查看全部 ${rows.length} 个`}</button>` : ''}`;
}
function stackBar(rows, total, unitFn, off = 0) {
  if (!total) return '<p class="sb-empty">暂无数据</p>';
  return `<div class="sb-stack">${rows.map((r, i) => `<i style="--c:${pal(i + off)};flex:${r.v}" title="${esc(r.name)} ${unitFn(r)}"></i>`).join('')}</div>
    <ul class="sb-legend">${rows.map((r, i) => `<li><i style="--c:${pal(i + off)}"></i><span>${esc(r.name)}</span><b>${unitFn(r)}</b><em>${Math.round(r.v / total * 100)}%</em></li>`).join('')}</ul>`;
}
function donutSvg(rows, total) {
  const r = 54, C = 2 * Math.PI * r; let off = 0;
  const segs = rows.map((x, i) => {
    const len = x.v / total * C, gap = rows.length > 1 ? Math.min(2.5, len / 2) : 0;
    const s = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${pal(i)}" stroke-width="12" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(x.name)} ${x.v} 本</title></circle>`;
    off += len; return s;
  }).join('');
  return `<svg class="sb-donut" viewBox="0 0 140 140" role="img" aria-label="地区分布环形图">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--soft)" stroke-width="12"/>${segs}
    <text x="70" y="70" text-anchor="middle" font-size="26" font-weight="600" style="fill:var(--ink);font-family:var(--num)">${total}</text>
    <text x="70" y="89" text-anchor="middle" font-size="11" style="fill:var(--muted)">本</text></svg>`;
}
function timeBlocks(books) {
  const isDated = b => /^\d{4}-\d{2}/.test(b.buyDate || '');
  const dated = books.filter(isDated), undated = sum(books.filter(b => !isDated(b)).map(qtyOf));
  const ym = new Map();
  dated.forEach(b => { const k = b.buyDate.slice(0, 7); const e = ym.get(k) || {count: 0, cost: 0}; e.count += qtyOf(b); e.cost += bookTotal(b); ym.set(k, e); });
  const years = [...new Set(dated.map(b => +b.buyDate.slice(0, 4)))].sort((a, b) => b - a);
  if (!years.length) return '<p class="sb-empty">填写购买时间后，这里会显示每个月买了多少</p>';
  if (!years.includes(statYear)) statYear = years.includes(new Date().getFullYear()) ? new Date().getFullYear() : years[0];
  const val = e => e ? (statMetric === 'cost' ? e.cost : e.count) : 0;
  const fmtV = v => statMetric === 'cost' ? (v >= 10000 ? (v / 10000).toFixed(1) + '万' : String(Math.round(v))) : String(v);
  const months = Array.from({length: 12}, (_, i) => ym.get(`${statYear}-${String(i + 1).padStart(2, '0')}`));
  const maxM = Math.max(1, ...months.map(val)), yearTotal = sum(months.map(val));
  const peak = months.reduce((best, e, i) => val(e) > val(months[best]) ? i : best, 0);
  const all = [...years].sort((a, b) => a - b), full = []; for (let y = all[0]; y <= all[all.length - 1]; y++) full.push(y);
  const maxC = Math.max(1, ...[...ym.values()].map(e => e.count));
  const lvl = n => n ? Math.min(4, Math.ceil(n / maxC * 4)) : 0;
  return `<div class="sb-cols">
    <div class="sb">
      ${blockHead('每月购买', 1, `<span class="sb-seg"><button class="${statMetric === 'count' ? 'on' : ''}" data-act="stat-metric" data-v="count">本数</button><button class="${statMetric === 'cost' ? 'on' : ''}" data-act="stat-metric" data-v="cost">花费</button></span>`)}
      <div class="sb-years">${years.map(y => `<button class="${y === statYear ? 'on' : ''}" data-act="stat-year" data-v="${y}">${y}</button>`).join('')}</div>
      <p class="sb-figure"><b class="num">${statMetric === 'cost' ? money(yearTotal) : yearTotal}</b><span>${statMetric === 'cost' ? '' : '本 · '}${statYear} 年${yearTotal ? ` · ${peak + 1} 月最多` : ''}</span></p>
      <div class="mbars">${months.map((e, i) => { const v = val(e); return `<div class="mbar${i === peak && v ? ' peak' : ''}" title="${i + 1}月：${e ? e.count + ' 本 · ' + money(e.cost) : '0 本'}">
        ${v ? `<small>${fmtV(v)}</small>` : ''}<i class="${v ? '' : 'zero'}" style="height:calc((100% - 18px) * ${v / maxM})"></i></div>`; }).join('')}</div>
      <div class="mlabels">${months.map((_, i) => `<span>${i + 1}</span>`).join('')}</div>
    </div>
    <div class="sb">
      ${blockHead('时间方块', 2, '每格一个月，越深买得越多')}
      <div class="heat-scroll"><div class="heat">
        <span></span>${Array.from({length: 12}, (_, i) => `<span class="h">${i + 1}</span>`).join('')}
        ${full.reverse().map(y => `<span class="y">${y}</span>${Array.from({length: 12}, (_, i) => {
          const e = ym.get(`${y}-${String(i + 1).padStart(2, '0')}`), n = e ? e.count : 0;
          return `<div class="cell l${lvl(n)}" title="${y}年${i + 1}月：${n} 本${e ? ' · ' + money(e.cost) : ''}">${n || ''}</div>`;
        }).join('')}`).join('')}
      </div></div>
      <div class="heat-legend">少<span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span>多</div>
      ${undated ? `<p class="sb-foot">另有 ${undated} 本没填购买时间，未计入</p>` : ''}
    </div>
  </div>`;
}
function renderStats() {
  const books = S.books;
  if (!books.length) {
    $('#view').innerHTML = `<div class="page-head"><div><h1>统计</h1></div></div><p class="sb-empty">书架上还没有本子，添加几本后这里会出现统计</p>`;
    return;
  }
  const total = sum(books.map(bookTotal)), copies = sum(books.map(qtyOf));
  const thisYear = String(new Date().getFullYear());
  const yearCost = sum(books.filter(b => (b.buyDate || '').startsWith(thisYear)).map(bookTotal));
  const transit = sum(books.filter(b => b.transit).map(qtyOf));
  const rated = books.filter(b => b.rating), avgRate = rated.length ? sum(rated.map(b => b.rating)) / rated.length : 0;
  const byIp = S.ips.map(ip => { const bs = books.filter(b => b.ipId === ip.id); return {name: ip.name, v: sum(bs.map(qtyOf)), cost: sum(bs.map(bookTotal))}; })
    .filter(x => x.v).sort((a, b) => b.v - a.v || b.cost - a.cost);
  const cps = sumBy(books, b => splitCp(b.cp)).map(x => ({...x, v: x.count, sub: [...new Set(books.filter(b => splitCp(b.cp).includes(x.name)).map(b => (ipById(b.ipId) || {}).name).filter(Boolean))].join('、')}));
  const noCp = sum(books.filter(b => !splitCp(b.cp).length).map(qtyOf));
  const regions = sumBy(books, b => [normOrigin(b.origin) || '未填写']).map(x => ({...x, v: x.count}));
  const kinds = sumBy(books, b => [b.kind || '未填写']).map(x => ({...x, v: x.count}));
  const reads = sumBy(books, b => [b.read || '未标记']).map(x => ({...x, v: x.count}));
  const labMap = new Map();
  books.forEach(b => allCosts(b).forEach(x => { const k = normLabel(x.label) || '其他'; labMap.set(k, (labMap.get(k) || 0) + toCny(x)); }));
  const labs = [...labMap.entries()].filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).map(([name, v]) => ({name, v}));
  const top = [...books].filter(b => bookTotal(b) > 0).sort((a, b) => bookTotal(b) - bookTotal(a)).slice(0, 5);
  const anyForeign = books.some(b => (b.costs || []).some(x => (x.cur || 'CNY') !== 'CNY' && Number(x.amount)));
  const th = themeOf(THEME);

  $('#view').innerHTML = `<div class="st" style="${themeVars()}">
    <div class="st-head">
      <h1>统计</h1>
      <a class="st-theme" href="#prefs" title="在设置里更换配色">${[0, 1, 2, 3, 4].map(i => `<i style="--c:${pal(i)}"></i>`).join('')}<span>${esc(th.name)}</span></a>
    </div>

    <section class="st-summary">
      <div class="st-total">
        <span class="st-cap">累计花费</span>
        <strong class="num">${money(total)}</strong>
        <span class="st-sub">${thisYear} 年 ${money(yearCost)}${anyForeign ? ' · 外币按设置里的汇率折合' : ''}</span>
      </div>
      <dl class="st-kpis">
        <div><dt>本子</dt><dd class="num">${copies}<small>本</small></dd><em>${books.length} 种${transit ? ` · ${transit} 本在途` : ''}</em></div>
        <div><dt>IP</dt><dd class="num">${byIp.length}<small>个</small></dd><em>${byIp[0] ? '最多 ' + esc(byIp[0].name) : '—'}</em></div>
        <div><dt>CP</dt><dd class="num">${cps.length}<small>个</small></dd><em>${cps[0] ? '最多 ' + esc(cps[0].name) : '—'}</em></div>
        <div><dt>平均评分</dt><dd class="num">${rated.length ? avgRate.toFixed(1) : '—'}${rated.length ? '<small>星</small>' : ''}</dd><em>${rated.length ? `${rated.length} 本已打分` : '还没有打分'}</em></div>
      </dl>
    </section>

    <section class="st-sec">
      <h2>收藏构成<span>按本数排序</span></h2>
      <div class="sb-cols">
        <div class="sb">${blockHead('IP', 4, `${byIp.length} 个`)}
          ${byIp.length ? barRows(byIp, {valFn: r => `<b>${r.v}</b> 本<span class="sb-dim">${money(r.cost)}</span>`, color: 'var(--p4)', limit: 6, moreKey: 'ip'}) : '<p class="sb-empty">还没有IP</p>'}</div>
        <div class="sb">${blockHead('CP', 5, `${cps.length} 个`)}
          ${cps.length ? barRows(cps, {valFn: r => `<b>${r.v}</b> 本<span class="sb-dim">${money(r.cost)}</span>`, color: 'var(--p5)', limit: 6, moreKey: 'cp'}) : '<p class="sb-empty">还没有填写CP的本子</p>'}
          ${noCp ? `<p class="sb-foot">另有 ${noCp} 本没填CP</p>` : ''}</div>
      </div>
    </section>

    <section class="st-sec">
      <h2>购买时间</h2>
      ${timeBlocks(books)}
    </section>

    <section class="st-sec">
      <h2>花费<span>按支付明细汇总</span></h2>
      <div class="sb-cols">
        <div class="sb">${blockHead('钱花在哪儿', 6, money(total))}
          ${labs.length ? stackBar(labs, total, r => money(r.v), 5) : '<p class="sb-empty">还没有支付明细</p>'}</div>
        <div class="sb">${blockHead('花费最多的本子', 8, '按实际支付')}
          <ol class="sb-top">${top.map((b, i) => `<li><a href="#book-${esc(b.id)}"><span class="sb-rank">${i + 1}</span><span class="sb-top-name">${esc(b.title || '无题')}<em>${esc((ipById(b.ipId) || {}).name || '')}</em></span><b class="num">${money(bookTotal(b))}</b></a></li>`).join('')}</ol></div>
      </div>
    </section>

    <section class="st-sec">
      <h2>本子分布</h2>
      <div class="sb-cols three">
        <div class="sb">${blockHead('地区', 1)}
          <div class="sb-donut-wrap">${donutSvg(regions, copies)}
            <ul class="sb-legend">${regions.map((r, i) => `<li><i style="--c:${pal(i)}"></i><span>${esc(r.name)}</span><b>${r.v}</b><em>${Math.round(r.v / copies * 100)}%</em></li>`).join('')}</ul></div></div>
        <div class="sb">${blockHead('类型', 3)}
          ${barRows(kinds, {valFn: r => `<b>${r.v}</b> 本`, color: 'var(--p3)'})}</div>
        <div class="sb">${blockHead('阅读状态', 7)}
          ${stackBar(reads, copies, r => r.v + ' 本', 6)}</div>
      </div>
    </section>
  </div>`;
}

async function blobToDataUrl(path) {
  const r = await fetch(path); if (!r.ok) throw new Error(r.status);
  const b = await r.blob();
  return await new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(b); });
}

/* 从图片提取主要颜色（最多 n 个，去掉接近纯白/纯黑和相近的颜色） */
function extractPalette(src, n = 10, minDist = 46) {
  return new Promise(res => {
    if (!src) return res([]);
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const w = 64, h = Math.max(1, Math.round(64 * img.naturalHeight / img.naturalWidth));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
        const d = x.getImageData(0, 0, w, h).data, bins = new Map();
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] < 128) continue;
          const k = (d[i] >> 4) << 8 | (d[i + 1] >> 4) << 4 | (d[i + 2] >> 4);
          const e = bins.get(k) || {r: 0, g: 0, b: 0, n: 0}; e.r += d[i]; e.g += d[i + 1]; e.b += d[i + 2]; e.n++; bins.set(k, e);
        }
        const cols = [...bins.values()].map(e => ({r: e.r / e.n, g: e.g / e.n, b: e.b / e.n, n: e.n})).sort((a, b) => b.n - a.n);
        const out = [];
        for (const c of cols) {
          const mx = Math.max(c.r, c.g, c.b), mn = Math.min(c.r, c.g, c.b), l = (mx + mn) / 510;
          if (l > 0.975 || l < 0.03) continue;
          if (out.every(o => Math.hypot(o.r - c.r, o.g - c.g, o.b - c.b) > minDist)) out.push(c);
          if (out.length >= n) break;
        }
        res(out.map(c => '#' + [c.r, c.g, c.b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('')));
      } catch { res([]); }
    };
    img.onerror = () => res([]);
    img.src = src;
  });
}

function compressImage(file, max = 1600, q = 0.85) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('读不了这张图片')); };
    img.src = url;
  });
}

const ymd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? `${m[1]}/${m[2]}/${m[3]}` : (s || ''); };

      if (files.length) { e.preventDefault(); addFiles(files); }
    };
    root.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); root.classList.add('drag'); } });
    root.addEventListener('dragleave', e => { if (e.target === root) root.classList.remove('drag'); });
    root.addEventListener('drop', e => { root.classList.remove('drag'); if (e.dataTransfer.files.length) { e.preventDefault(); addFiles([...e.dataTransfer.files]); } });

    // 下拉“自己填”
    root.addEventListener('change', e => {
      if (e.target.dataset && e.target.dataset.custom) { const c = $('#' + e.target.id + '-c', root); c.hidden = e.target.value !== '__custom'; if (!c.hidden) c.focus(); }
    });

    // 支付明细（按本分组；第 2 本起默认折叠）
    const rowHtml = (c, si, i) => {
      const known = !c.label || COST_LABELS.includes(c.label), custom = c._custom || !known;
      return `<div class="cost-row" data-s="${si}" data-i="${i}">
        <span class="drag" title="按住拖动调整顺序" aria-label="拖动调整顺序">⋮⋮</span>
        <div class="cost-label">
          <select class="input" data-k="labelSel" aria-label="项目">
            <option value="" ${!c.label && !custom ? 'selected' : ''}>选择项目</option>
            ${COST_LABELS.map(o => `<option value="${esc(o)}" ${o === c.label && !custom ? 'selected' : ''}>${esc(o)}</option>`).join('')}
            <option value="__custom" ${custom ? 'selected' : ''}>自己填…</option>
          </select>
          ${custom ? `<input class="input" data-k="label" value="${esc(c.label)}" placeholder="项目名称" maxlength="20" aria-label="自填项目名称">` : ''}
        </div>
        <select class="input" data-k="cur" aria-label="币种">${curOpts(c.cur)}</select>
        <input class="input num" data-k="amount" value="${esc(c.amount)}" type="number" inputmode="decimal" step="any" min="0" placeholder="0" aria-label="金额">
        <button type="button" class="x" data-rmc="${i}" aria-label="删除这一项">×</button></div>`;
    };
    const subOf = si => money(sum(sets[si].map(toCny)));
    const drawCosts = () => {
      costBox.innerHTML = sets.map((st, si) => {
        const rows = `<div class="cs-rows">${st.map((c, i) => rowHtml(c, si, i)).join('')}</div><button type="button" class="btn small cs-add" data-adds="${si}">＋ 添加一项</button>`;
        if (si === 0) return `<div class="cost-set" data-s="0"><div class="cs-head"><b>第 1 本</b><span class="cs-sub" data-s="0">小计 ${subOf(0)}</span></div>${rows}</div>`;
        const open = openSets.has(si);
        return `<div class="cost-set sub ${open ? 'open' : ''}" data-s="${si}">
          <button type="button" class="cs-head cs-toggle" data-tog="${si}" aria-expanded="${open}"><b>第 ${si + 1} 本</b><span class="cs-sub" data-s="${si}">${st.length} 项 · 小计 ${subOf(si)}</span><i>${open ? '收起' : '展开'}</i></button>
          ${open ? rows + `<button type="button" class="btn small text danger cs-del" data-dels="${si}">删除第 ${si + 1} 本的明细</button>` : ''}</div>`;
      }).join('') + (sets.length < 20 ? `<button type="button" class="cs-more" id="bk-addset">＋ 第 ${sets.length + 1} 本的明细<small>会先照第 1 本填好，可以再改</small></button>` : '');
      calc();
    };
    // 拖动 ⋮⋮ 调整顺序（只在同一本的明细里移动）
    costBox.addEventListener('pointerdown', e => {
      const h = e.target.closest('.drag'); if (!h) return;
      e.preventDefault();
      const row = h.closest('.cost-row'), box = row.parentElement, si = +row.dataset.s; row.classList.add('dragging');
      const move = ev => {
        const rows = $$('.cost-row', box).filter(r => r !== row);
        const after = rows.find(r => { const b = r.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; });
        if (after) { if (after !== row.nextSibling) box.insertBefore(row, after); }
        else if (row !== box.lastElementChild) box.appendChild(row);
      };
      const up = () => {
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
        row.classList.remove('dragging');
        const order = $$('.cost-row', box).map(r => +r.dataset.i);
        if (order.some((v, i) => v !== i)) { sets[si] = order.map(i => sets[si][i]); touch(); }
        drawCosts();
      };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    });
    const calc = () => {
      const cs = costSummary(sets.flat());
      $('#bk-total', root).textContent = money(cs.cny);
      $('#bk-orig', root).textContent = cs.foreign ? `原币 ${cs.orig}` : '';
      sets.forEach((st, si) => { const el = $(`.cs-sub[data-s="${si}"]`, costBox); if (el) el.textContent = (si ? st.length + ' 项 · ' : '') + '小计 ' + subOf(si); });
      $('#bk-setsnote', root).textContent = sets.length > 1 ? `共 ${sets.length} 本的明细` : '';
    };
    const syncQty = () => { const q = $('#bk-qty', root); if ((parseInt(q.value, 10) || 1) < sets.length) q.value = sets.length; };
    const onCost = e => {
      const row = e.target.closest('.cost-row'), k = e.target.dataset.k; if (!row || !k) return;
      const c = sets[+row.dataset.s][+row.dataset.i];
      if (k === 'labelSel') {
        if (e.type !== 'change') return;
        if (e.target.value === '__custom') { c._custom = true; c.label = COST_LABELS.includes(c.label) ? '' : c.label; drawCosts(); const inp = $(`.cost-row[data-s="${row.dataset.s}"][data-i="${row.dataset.i}"] input[data-k=label]`, costBox); if (inp) inp.focus(); }
        else { c._custom = false; c.label = e.target.value; if (row.querySelector('input[data-k=label]')) drawCosts(); }
        return calc();
      }
      c[k] = e.target.value; calc();
    };
    costBox.addEventListener('input', onCost); costBox.addEventListener('change', onCost);
    costBox.addEventListener('click', e => {
      const rm = e.target.closest('[data-rmc]');
      if (rm) { const si = +rm.closest('.cost-row').dataset.s; sets[si].splice(+rm.dataset.rmc, 1); drawCosts(); touch(); return; }
      const add = e.target.closest('[data-adds]');
      if (add) { const si = +add.dataset.adds, last = sets[si][sets[si].length - 1]; sets[si].push({label: '', amount: '', cur: last ? last.cur : 'CNY'}); drawCosts(); touch();
        const sel = $$(`.cost-row[data-s="${si}"] select[data-k=labelSel]`, costBox).slice(-1)[0]; if (sel) sel.focus(); return; }
      const tog = e.target.closest('[data-tog]');
      if (tog) { const si = +tog.dataset.tog; openSets.has(si) ? openSets.delete(si) : openSets.add(si); drawCosts(); return; }
      const del = e.target.closest('[data-dels]');
      if (del) { const si = +del.dataset.dels; sets.splice(si, 1); const keepOpen = [...openSets].filter(x => x !== si).map(x => x > si ? x - 1 : x); openSets.clear(); keepOpen.forEach(x => openSets.add(x)); drawCosts(); touch(); return; }
      if (e.target.closest('#bk-addset')) {
        const base = sets[0].length ? sets[0] : [{label: '本体', amount: '', cur: 'CNY'}];
        sets.push(base.map(c => ({label: c.label, amount: c.amount, cur: c.cur || 'CNY', _custom: c._custom})));
        openSets.add(sets.length - 1); syncQty(); drawCosts(); touch();
      }
    });
    // 数量 − / ＋
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-step]'); if (!b) return;
      const q = $('#bk-qty', root); q.value = Math.min(999, Math.max(1, (parseInt(q.value, 10) || 1) + +b.dataset.step)); touch();
    });

    // 星星
    const drawStars = () => { starBox.innerHTML = starsInner(d.rating, ''); starBox.dataset.rating = Number(d.rating) || 0; };
    starBox.onclick = e => { const b = e.target.closest('[data-n]'); if (!b) return; const n = +b.dataset.n; d.rating = d.rating === n ? 0 : n; drawStars(); touch(); };

    const ipSel = $('#bk-ip', root), newIp = $('#bk-newip', root);
    ipSel.onchange = () => { newIp.hidden = ipSel.value !== '__new'; if (!newIp.hidden) newIp.focus(); };
    drawImgs(); drawCosts(); drawStars();
    if (isNew && !draft) setTimeout(() => $('#bk-title', root).focus(), 50);

    $('#bk-form', root).onsubmit = async e => {
      e.preventDefault();
      collect(); keep();
      ['title', 'author', 'club', 'cp', 'note', 'buyDate', 'releaseDate', 'link'].forEach(k => { d[k] = String(d[k] || '').trim(); });
      let link = d.link; if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link; d.link = link;
      if (!d.title) return toast('请填写本子名');
      if (ipSel.value === '__new') {
        const name = newIp.value.trim(); if (!name) return toast('请填写新IP的名称');
        let ip = S.ips.find(x => x.name === name);
        if (!ip) { ip = {id: uid(), name, color: COLORS[S.ips.length % COLORS.length], created: Date.now()}; if (!(await save('ips', ip))) return; S.ips.push(ip); }
        d.ipId = ip.id;
      } else d.ipId = ipSel.value;
      const clean = st => st.filter(c => String(c.label || '').trim() || String(c.amount).trim())
        .map(c => ({label: normLabel(c.label), amount: Math.max(0, parseFloat(c.amount) || 0), cur: c.cur || 'CNY'}));
      d.costs = clean(sets[0]); d.more = sets.slice(1).map(clean).filter(st => st.length); delete d.unit;
      d.updated = Date.now();
      const out = clone(d); delete out._ipSel; delete out._newIp;
      const btn = $('#bk-form button[type=submit]', root); btn.disabled = true; btn.textContent = Store.cloud && out.images.some(x => /^data:/.test(x)) ? '上传图片中…' : '保存中…';
      const ok = await save('books', out);
      btn.disabled = false; btn.textContent = '保存';
      if (!ok) return;
      done = true; clearTimeout(timer); await Drafts.del(draftKey);
      const i = S.books.findIndex(x => x.id === out.id); i >= 0 ? S.books[i] = out : S.books.push(out);
      closeModal(); toast('已保存');
      if (location.hash === '#book-' + out.id) route(); else location.hash = 'book-' + out.id;
    };
  });
}

/* ---------- 大图 ---------- */
let lbIdx = 0, lbImgs = [];
function openLightbox(imgs, i) { lbImgs = imgs; lbIdx = i; drawLightbox(); $('#lightbox').hidden = false; }
function drawLightbox() {
  const many = lbImgs.length > 1;
  $('#lightbox').innerHTML = `<img src="${imgSrc(lbImgs[lbIdx])}" alt="">${many ? `<button class="nav prev" data-lb="-1" aria-label="上一张">‹</button><button class="nav next" data-lb="1" aria-label="下一张">›</button><div class="count">${lbIdx + 1} / ${lbImgs.length}</div>` : ''}`;
}
function closeLightbox() { const lb = $('#lightbox'); lb.hidden = true; lb.innerHTML = ''; }
$('#lightbox').addEventListener('click', e => {
  const n = e.target.closest('[data-lb]');
  if (n) { lbIdx = (lbIdx + +n.dataset.lb + lbImgs.length) % lbImgs.length; drawLightbox(); } else closeLightbox();
});
let tx0 = null;
$('#lightbox').addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; }, {passive: true});
$('#lightbox').addEventListener('touchend', e => {
  if (tx0 === null || lbImgs.length < 2) return; const dx = e.changedTouches[0].clientX - tx0; tx0 = null;
  if (Math.abs(dx) > 50) { e.preventDefault(); lbIdx = (lbIdx + (dx < 0 ? 1 : -1) + lbImgs.length) % lbImgs.length; drawLightbox(); }
});

/* ================= 点击分发 ================= */
document.addEventListener('click', async e => {
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); return; }
  const go = e.target.closest('[data-go]');
  if (go) { location.hash = go.dataset.go; return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const curBook = () => bookById(decodeURIComponent(location.hash).slice(6));
  switch (act) {
    case 'lock': lockNow(); break;
    case 'new-ip': openIpForm(); break;
    case 'edit-ip': openIpForm(ipById(id)); break;
    case 'new-book': openBookForm(null, el.dataset.ip); break;
    case 'edit-book': openBookForm(bookById(id)); break;
    case 'sample': loadSample(); break;
    case 'del-sample': deleteSample(); break;
    case 'export': exportBackup(); break;
    case 'view': viewMode = el.dataset.v; Store.put('meta', viewMode, 'view').catch(() => {}); renderHome(); break;
    case 'pin-view': startView = viewMode; try { await Store.put('meta', startView, 'startView'); toast(`以后打开网站会先显示${viewMode === 'flow' ? '瀑布流' : '书架'}`); } catch (e) { toast(errMsg(e)); } renderHome(); break;
    case 'flow-ip': flowIp = el.dataset.v; renderHome(); break;
    case 'stat-year': case 'stat-metric': {
      if (act === 'stat-year') statYear = +el.dataset.v; else statMetric = el.dataset.v;
      const y = window.scrollY; renderStats(); window.scrollTo(0, y); break;
    }
    case 'live-rates': fetchLiveRates(); break;
    case 'stat-more': { statAll[el.dataset.v] = !statAll[el.dataset.v]; const y = window.scrollY; renderStats(); window.scrollTo(0, y); break; }
    case 'del-theme': {
      const id = el.dataset.v; USER_THEMES = USER_THEMES.filter(t => t.id !== id);
      if (THEME === id) THEME = 'default';
      try { await Store.put('meta', USER_THEMES, 'themes'); await Store.put('meta', THEME, 'theme'); } catch (e) { toast(errMsg(e)); }
      const y = window.scrollY; renderSettings(); window.scrollTo(0, y); toast('已删除这个配色'); break;
    }
    case 'set-theme': {
      THEME = el.dataset.v; const y = window.scrollY; renderSettings(); window.scrollTo(0, y);
      try { await Store.put('meta', THEME, 'theme'); toast(`已换成“${themeOf(THEME).name}”配色，去统计页看看`); } catch (e) { toast(errMsg(e)); }
      break;
    }
    case 'sign-out': {
      if (Store.kind !== 'sb') break;
      if (!(await confirmBox('退出当前账号？书架数据仍保存在云端，重新登录即可看到。', '退出登录'))) break;
      await Store.remote.signOut(); location.hash = ''; location.reload(); break;
    }
    case 'copy-url': {
      try { await navigator.clipboard.writeText(($('#cloud-url') || {}).textContent || CLOUD_URL); toast('链接已复制'); }
      catch { const c = $('#cloud-url'); if (c) { const r = document.createRange(); r.selectNodeContents(c); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast('请长按或按 Ctrl+C 复制选中的链接'); }
      break;
    }
    case 'use-rate': { const c = el.dataset.c; const inp = $('#rate-' + c); if (inp && LIVE && LIVE[c]) { inp.value = +LIVE[c].toPrecision(5); toast(`已填入${CUR[c].n}，记得点“保存汇率”`); } break; }
    case 'use-all-rates': {
      if (!LIVE) return;
      RATES = {...RATES}; Object.entries(LIVE).forEach(([c, v]) => { RATES[c] = +v.toPrecision(5); const inp = $('#rate-' + c); if (inp) inp.value = RATES[c]; });
      await Store.put('meta', RATES, 'rates'); toast('已按实时汇率保存'); break;
    }
    case 'reset-logo': BRAND.logo = ''; await Store.put('meta', BRAND, 'brand'); applyBrand(); renderSettings(); toast('已恢复默认 LOGO'); break;
    case 'reset-rates': RATES = {...DEFAULT_RATES}; await Store.put('meta', RATES, 'rates'); renderSettings(); toast('已恢复默认汇率'); break;
    case 'arrive': {
      const b = bookById(id); if (!b) return; b.transit = false;
      if (await save('books', b)) { toast(`《${b.title}》已到手`); const y = window.scrollY; route(); window.scrollTo(0, y); }
      break;
    }
    case 'del-book': {
      const b = bookById(id);
      if (!(await confirmBox(`删除《${b.title || '无题'}》？删除后无法恢复。`))) return;
      try { await Store.del('books', id); } catch (err) { toast(errMsg(err)); return; }
      S.books = S.books.filter(x => x.id !== id);
      toast('已删除'); location.hash = 'ip-' + b.ipId; break;
    }
    case 'thumb': galleryIdx = +el.dataset.i; renderBook(lastBookId); break;
    case 'zoom': { const b = curBook(); if (b && b.images.length) openLightbox(b.images, galleryIdx); break; }
    case 'rate': {
      const b = curBook(); if (!b) return; const n = +el.dataset.n;
      b.rating = b.rating === n ? 0 : n;
      if (await save('books', b)) { const y = window.scrollY; renderBook(b.id); window.scrollTo(0, y); }
      break;
    }
    case 'wipe': {
      if (!(await confirmBox('清空全部 IP、本子、图片和密码？此操作无法恢复。建议先导出备份。', '清空'))) return;
      await wipeAll(); afterWipe(); break;
    }
  }
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
initLock();
