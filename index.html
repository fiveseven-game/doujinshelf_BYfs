/* 布局：极简扁平。首页 = 在途栏 + 收藏（书脊书架 / 瀑布流）；IP 合集 → 封面墙 → 详情 */
:root{
  --bg:#ffffff; --ink:#16181d; --muted:#8b909a; --line:#ececef; --line-2:#d7d9de; --soft:#f4f5f7;
  --accent:#2f5bd3; --accent-soft:#eaf0ff; --btn:#16181d; --btn-ink:#ffffff;
  --danger:#d64545; --star:#f2b233; --transit:#e58a1f; --transit-soft:#fdf2e4;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --num:-apple-system,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1013; --ink:#ececf0; --muted:#8d929c; --line:#22242a; --line-2:#33363d; --soft:#18191d;
    --accent:#7d9cff; --accent-soft:#1c2440; --btn:#ececf0; --btn-ink:#0f1013;
    --danger:#ff6b6b; --star:#f5c04a; --transit:#f0a04a; --transit-soft:#2a2116;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0f1013; --ink:#ececf0; --muted:#8d929c; --line:#22242a; --line-2:#33363d; --soft:#18191d;
    --accent:#7d9cff; --accent-soft:#1c2440; --btn:#ececf0; --btn-ink:#0f1013;
    --danger:#ff6b6b; --star:#f5c04a; --transit:#f0a04a; --transit-soft:#2a2116;
    color-scheme:dark;
  }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-tap-highlight-color:transparent;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* 锁屏 */
html.resuming #lock .lock-card{visibility:hidden}
#lock{min-height:100vh;display:grid;place-items:center;padding-block:40px}
.lock-card{width:min(340px,100%);display:grid;gap:16px;text-align:center}
.lock-mark{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:44px;border-bottom:2px solid var(--ink);width:84px;margin:0 auto}
.lock-mark i{display:block;width:10px;border-radius:2px 2px 0 0;background:var(--c)}
.lock-title{font-size:22px;font-weight:600;letter-spacing:.08em}
.lock-slogan{margin:-10px 0 2px;font-size:13px;color:var(--muted);letter-spacing:.12em}
.lock-sub{color:var(--muted);margin:-8px 0 0;font-size:14px}
.lock-form{display:grid;gap:10px}
.lock-msg{min-height:1.4em;font-size:13px;color:var(--danger)}
.lock-link{background:none;border:0;color:var(--muted);font-size:13px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* 控件 */
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
.field>span i{font-style:normal;margin-left:4px;opacity:.7}
.input{width:100%;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid transparent;background:var(--soft);outline:none;appearance:none;-webkit-appearance:none}
select.input{padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.input:focus{border-color:var(--accent);background-color:var(--bg)}
input[type=date].input{min-height:44px}
textarea.input{resize:vertical;min-height:90px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;border:0;background:var(--soft);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.primary:hover{opacity:.88}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.small{padding:5px 11px;font-size:13px}
.btn.block{width:100%}
.btn.text{background:none;padding:6px 4px;color:var(--muted)}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:8px;border:0;background:transparent;color:var(--ink)}
.icon-btn:hover{background:var(--soft)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:500}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none}
.chips button{flex:none;border:0;background:var(--soft);color:var(--muted);padding:5px 12px;border-radius:99px;font-size:13px}
.chips button.on{background:var(--btn);color:var(--btn-ink)}
.chips.wrap{flex-wrap:wrap;overflow:visible;row-gap:8px}
.tag{display:inline-block;font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;background:var(--soft);color:var(--muted);font-weight:500;vertical-align:middle;white-space:nowrap}
.tag.transit{background:var(--transit-soft);color:var(--transit)}
.cover .tag.done,.wf .pic .tag.done{top:auto;bottom:6px;left:6px;display:inline-flex;align-items:center;gap:2px;background:rgba(36,128,88,.9);color:#fff;padding:0 6px 0 4px}
.tag.done svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tag.age{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}

/* 顶栏/标签 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:54px}
.brand{font-weight:600;font-size:17px;letter-spacing:.06em;display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
.brand-dots{display:flex;align-items:flex-end;gap:2px;height:16px;border-bottom:1.5px solid var(--ink)}
.brand-dots i{width:4px;background:var(--c)}
.toptabs{display:none;gap:2px;margin-left:16px}
.spacer{flex:1}
.tab{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:14px}
.tab.on{color:var(--ink);font-weight:600}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar .tab{flex-direction:column;gap:1px;font-size:11px;padding:3px 18px}
.tabbar .tab.on{color:var(--ink)}
main{padding-block:22px calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.toptabs{display:flex}.tabbar{display:none}main{padding-bottom:56px}}

/* 通用 */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:24px}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.head-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-head h2{font-size:16px}
.sec-head h2 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.crumb{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:12px}
.crumb:hover{color:var(--ink)}
.notice{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:var(--accent-soft);font-size:13px;margin-bottom:18px}
.section{margin-bottom:32px}

/* 在途 */
.transit-list{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.t-card{flex:none;width:250px;display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--soft);min-width:0}
.t-card .mini{width:44px;height:60px;flex:none;border-radius:3px;overflow:hidden;border:0;padding:0;background:var(--line)}
.t-card .mini img{width:100%;height:100%;object-fit:cover}
.t-card .mini .ph.loading{opacity:.75}
.t-card .mini .ph span{font-size:10px}
.t-info{min-width:0;flex:1;display:grid;gap:1px;text-align:left;border:0;background:none;padding:0}
.t-info b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-info span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-card .btn{flex:none}
.transit-empty{padding:14px;border-radius:10px;background:var(--soft);color:var(--muted);font-size:13px}

/* 书脊书架 */
.shelf{position:relative;
  --row:228px;
  display:grid;grid-template-columns:repeat(auto-fill,54px);grid-auto-rows:var(--row);column-gap:6px;
  background-image:linear-gradient(to bottom,transparent 0 208px,var(--line-2) 208px 210px,transparent 210px);
  background-size:100% var(--row);
}
.spine{align-self:end;margin-bottom:20px;width:54px;border:0;padding:12px 0 10px;border-radius:2px 2px 0 0;background:var(--c);color:#fff;display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;gap:8px;transition:transform .16s ease;min-height:0;overflow:hidden}
.spine:hover,.spine:focus-visible{transform:translateY(-6px)}
.spine-title{writing-mode:vertical-rl;-webkit-text-orientation:upright;text-orientation:upright;white-space:nowrap;align-self:center;justify-self:center;font-weight:600;font-size:15px;line-height:1.2;min-height:0}
.spine .spine-count{font:500 12px/1 var(--num);text-shadow:none;opacity:.85;white-space:nowrap;background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;outline:0;padding:0;min-width:0;width:auto;height:auto}
.spine.has-img .spine-count{text-shadow:0 1px 2px rgba(0,0,0,.6)}
.spine.add{background:transparent;border:1.5px dashed var(--line-2);color:var(--muted)}
.shelf.dragging .spine:hover{transform:none}
.spine.drag-src{opacity:.22;transform:scale(.96);transition:opacity .15s,transform .15s}
.spine.drag-ghost{background-color:var(--c);padding:12px 0 10px;margin:0;border-radius:2px 2px 0 0;filter:drop-shadow(0 12px 20px rgba(0,0,0,.25))}
.spine.add .spine-title{font-weight:500;font-size:13px}
/* 书脊文字：整列竖排（writing-mode 写在标题本身，不用 flex 套竖排子元素 —— Safari 会把那种结构的高度算错、文字被切掉一半）。
   每段是一个 inline-block：汉字段正立；连续 2 个以上的英文 / 数字 / 符号横排后顺时针转 90 度；段与段之间用 margin 留间距。
   间距参照 W3C《中文排版需求》(clreq) / 《日文排版需求》(JLREQ)：汉字与西文之间约 1/4 em；
   书脊文字粗、列窄，手机取 0.34em（至少 5px）；有鼠标的设备（电脑）上雅黑 / 苹方字框更满，放宽到 0.55em（至少 8px）。 */
:root{--sw-gap:max(5px,.34em)}
@media (any-pointer:fine){:root{--sw-gap:max(8px,.55em)}}
.spine-title .sg{display:inline-block;line-height:1.2;letter-spacing:.06em}
.spine-title .sg+.sg{margin-top:var(--sw-gap)}
/* 字母/数字：不依赖浏览器的“侧躺”排版，直接把横排文字顺时针转 90°，盒子大小由脚本量出来，各浏览器位置一致 */
.spine-title.clip{align-self:start;overflow:hidden;-webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
.spine-title .rot{position:relative;width:1.2em;height:2em;vertical-align:top}
.spine-title .rot i{position:absolute;left:50%;top:0;font-style:normal;writing-mode:horizontal-tb;white-space:nowrap;line-height:1.2;letter-spacing:.03em;font-variant-numeric:tabular-nums;transform-origin:0 0;transform:rotate(90deg) translateY(-50%)}
   /* 名字太长：从顶部开始显示，底部淡出 */
.shelf-empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--soft);border-radius:10px}
.shelf-empty strong{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:4px}
.shelf-empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* 瀑布流 */
.flow{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px;align-items:start}
@media (min-width:720px){.flow{gap:16px}}
.flow-col{display:grid;gap:16px;min-width:0}
.wf{display:block;width:100%;border:0;background:none;padding:0;margin:0;text-align:left}
.wf .pic{position:relative;border-radius:6px;overflow:hidden;background:var(--soft);transition:opacity .16s}
.wf:hover .pic{opacity:.9}
.wf .pic img{width:100%;height:auto}
.wf .pic .ph{aspect-ratio:5/7;height:auto}
.wf .pic .tag{position:absolute;top:6px;left:6px}
.wf .pic .tag.qty{left:auto;right:6px;background:rgba(0,0,0,.55);color:#fff}
.wf-title{font-size:15px;font-weight:600;margin-top:8px;line-height:1.35;overflow-wrap:anywhere;letter-spacing:.01em}
.wf-by{font-size:13px;color:var(--ink);opacity:.72;margin-top:3px;line-height:1.35;overflow-wrap:anywhere}
.wf-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted);line-height:1.3}
.wf-meta i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.wf-cp{padding:0 6px;border-radius:4px;background:var(--soft);line-height:18px}
.spine.has-img{background-size:cover;background-position:center}
.spine.has-img .spine-title{text-shadow:0 1px 2px rgba(0,0,0,.55)}
.dates{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.dates span{display:inline-flex;gap:6px;align-items:baseline}
.dates em{font-style:normal;color:var(--muted);font-size:12px}
.dates i{font-style:normal;color:var(--line-2)}
.buy-facts{display:flex;gap:20px;text-align:right}
.buy-facts small{display:block;font-size:12px;color:var(--muted)}
.buy-facts b{font:600 17px var(--num)}
.buy-facts span{font-size:12px;color:var(--muted);margin-left:3px}
.buy-facts i{font-style:normal;color:var(--muted);font-size:13px;display:block;margin-top:3px}
.buy .buy-sum{text-align:left}
.price-cap{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.buy .price-cap+.price-lines{margin-top:6px;padding-top:0;border-top:0}
.unit-in{position:relative}
.unit-in input{padding-right:30px}
.unit-in input,.words-in input{-moz-appearance:textfield;appearance:textfield}
.unit-in input::-webkit-inner-spin-button,.unit-in input::-webkit-outer-spin-button,.words-in input::-webkit-inner-spin-button,.words-in input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.unit-in em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:14px;pointer-events:none}
.words-in{display:grid;grid-template-columns:minmax(0,1fr) 4.6em;gap:6px}
.words-in select.input{padding-left:8px;padding-right:20px;background-position:calc(100% - 11px) 50%,calc(100% - 6px) 50%}
.unit-row{display:grid;grid-template-columns:minmax(0,1fr) 5.4em;gap:6px}
.form-note{margin:-4px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.buy-qty{font-size:13px;color:var(--muted);margin-top:4px;display:block}
.buy-when .buy-qty b{display:inline;font-size:15px;color:var(--ink);font-weight:600}
.buy-sum small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}

/* 合集 */
.coll-head{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.coll-mark{width:6px;align-self:stretch;min-height:44px;border-radius:2px;background:var(--c)}
.coll-head h1{font-size:24px}
.coll-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.coll-head .btn{margin-left:auto}
.covers{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:20px 12px}
@media (min-width:720px){.covers{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px}}
.cover-card{border:0;background:none;padding:0;text-align:left;display:grid;gap:6px;align-content:start;min-width:0}
.cover{aspect-ratio:5/7;max-width:100%;border-radius:4px;overflow:hidden;background:var(--soft);position:relative;transition:transform .16s}
.cover-card:hover .cover{transform:translateY(-3px)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .tag{position:absolute;left:6px;top:6px}
.cover-text{display:grid;gap:2px;min-width:0;margin-top:2px}
.cover-title{font-weight:600;font-size:14px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cover-by{font-size:12.5px;color:var(--ink);opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover-meta{display:flex;gap:6px;align-items:center;margin-top:4px;min-width:0}
.cover-cp{font-size:11.5px;color:var(--muted);background:var(--soft);border-radius:4px;padding:0 6px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cover-rate{font-size:11.5px;color:var(--star);flex:none;font-variant-numeric:tabular-nums}
.ct{display:grid;min-width:0;margin-top:8px}
.ct-title{font-size:14.5px;font-weight:600;line-height:1.35;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ct-by{font-size:12.5px;line-height:1.4;color:var(--ink);opacity:.68;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-tags{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:7px;min-width:0}
.ct-ip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-ip i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.ct-cp{font-size:11px;line-height:17px;padding:0 6px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ct-marks{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:6px;min-height:18px;padding-top:6px;border-top:1px solid var(--line);min-width:0}
.covers .ms-row{letter-spacing:0;font-size:11px}
.ms{display:inline-flex;align-items:center;gap:4px;color:color-mix(in srgb,var(--star) 86%,var(--ink));font-variant-numeric:tabular-nums;line-height:1}
.ms-row{position:relative;display:inline-block;font-size:11.5px;letter-spacing:1px;line-height:1}
.ms-bg{color:var(--line-2)}
.ms-fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap}
.ms b{font-size:12px;font-weight:600;color:inherit}
.cover-card .ct{margin-top:2px}
.marks{display:flex;align-items:center;gap:6px;margin-top:5px;min-height:18px;flex-wrap:nowrap}
.mark-rate{font-size:12px;white-space:nowrap;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;line-height:18px}
.mark-rate i{font-style:normal;color:var(--star);margin-left:1px}
.mark-rate.none{color:var(--line-2);font-weight:400}
.mark-age{white-space:nowrap;flex:none;font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;font-weight:500;background:color-mix(in srgb,var(--c) 14%,var(--bg));color:color-mix(in srgb,var(--c) 80%,var(--ink))}
.cover .tag.qty{left:auto;right:6px;background:rgba(0,0,0,.55);color:#fff}
.ph{width:100%;height:100%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;padding:12%}
.ph span{writing-mode:vertical-rl;font-weight:600;font-size:16px;letter-spacing:.12em;max-height:100%;overflow:hidden}
.ph.big span{font-size:26px}
.cover-add{aspect-ratio:5/7;max-width:100%;border-radius:4px;border:1.5px dashed var(--line-2);display:grid;place-items:center;align-content:center;gap:2px;color:var(--muted);font-size:13px}
.cover-add b{font-size:26px;line-height:1;font-weight:300}
.cover-card:hover .cover-add{border-color:var(--ink);color:var(--ink)}

.drag-hint{margin:-6px 0 14px;line-height:1.5;font-size:12px;color:var(--muted)}
.covers .cover-card[data-id]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:pan-y}
.covers .cover-card img{-webkit-user-drag:none;pointer-events:none}
.covers.dragging .cover-card:hover .cover{transform:none}
.cover-card.drag-src{opacity:.22;transform:scale(.96);transition:opacity .15s,transform .15s}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;background:var(--bg);border-radius:8px;padding-bottom:6px;transform:scale(1.06) rotate(-1.5deg);filter:drop-shadow(0 12px 20px rgba(0,0,0,.25))}
/* 详情 */
.detail{max-width:620px;margin:0 auto}
.gallery{display:grid;gap:10px;margin-bottom:22px}
.gallery-main{border:0;padding:0;border-radius:8px;overflow:hidden;background:var(--soft);display:grid;place-items:center;max-height:62vh}
.gallery-main img{max-height:62vh;width:auto;max-width:100%;object-fit:contain}
.gallery-main .ph{aspect-ratio:5/7;height:auto;width:min(260px,64vw)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:none;width:52px;height:70px;padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;background:var(--soft)}
.thumbs button.on{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.transit-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:8px;background:var(--transit-soft);color:var(--transit);font-size:14px;font-weight:500;margin-bottom:14px}
.book-title{font-size:24px;line-height:1.35}
.title-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.meta{margin:16px 0 0}
.meta>div{display:grid;grid-template-columns:5.5em 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.meta>div:first-child{border-top:1px solid var(--line)}
.meta dt{color:var(--muted);font-size:13px;padding-top:1px}
.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.meta dd a{text-decoration:none;font-weight:500}
.block{margin-top:24px}
.block h3{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:500;margin-bottom:8px}
.price{background:var(--soft);border-radius:10px;padding:14px 16px}
.price-total{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price-total strong{font:600 26px/1.1 var(--num);font-variant-numeric:tabular-nums}
.price-orig{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.price-lines{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line-2);display:grid;gap:4px}
.price-lines li{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.price-lines li span:last-child{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--ink);text-align:right}
.price-lines li small{color:var(--muted);margin-left:6px}
.stars{display:flex;gap:4px}
.stars svg{width:100%;height:100%;fill:currentColor;display:block}
/* 半星：灰色底星 + 按比例露出的金色星；每颗星左右两半各是一个按钮 */
.star{position:relative;width:34px;height:34px;flex:none;transition:transform .12s}
.star:active{transform:scale(.9)}
.star-bg{position:absolute;inset:0;color:var(--line-2)}
.star-fg{position:absolute;left:0;top:0;bottom:0;overflow:hidden;color:var(--star);width:0}
.star-fg svg{width:34px;height:34px}
.stars .star-half{position:absolute;top:0;bottom:0;width:50%;border:0;background:none;padding:0;margin:0;cursor:pointer}
.stars .star-half.l{left:0}.stars .star-half.r{right:0}
.stars .star-half:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.stars-note{font-size:12px;color:var(--muted);margin-top:2px}
.note{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;background:var(--soft);border-radius:10px;padding:14px 16px}
.note.empty{color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}

/* 统计 */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:30px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--soft);border-radius:10px;padding:14px 16px;min-width:0}
.tile span{font-size:12px;color:var(--muted)}
.tile strong{display:block;font:600 26px/1.25 var(--num);font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.tile small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.tile em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cs-head{display:flex;align-items:center;gap:10px;width:100%;padding:2px 4px 8px;font-size:13px;border:0;background:none;text-align:left}
.cs-head b{font-weight:600}
.cs-head span{color:var(--muted);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}
.cs-toggle{padding:10px 12px;cursor:pointer}
.cost-set.open .cs-toggle{padding:2px 4px 8px}
.cs-toggle i{font-style:normal;font-size:12px;color:var(--accent)}
.cs-add{margin:2px 0 0 26px}
.cs-del{margin:4px 0 0 20px}
.cs-more{display:grid;gap:1px;width:100%;padding:10px 12px;border:1.5px dashed var(--line-2);border-radius:10px;background:none;text-align:left;font-size:14px;font-weight:500;color:var(--ink)}
.cs-more small{font-size:12px;color:var(--muted);font-weight:400}
.cs-more:hover{border-color:var(--ink)}
/* 首页：默认视图 */
.view-tools{display:flex;align-items:center;gap:8px}
.pin{border:0;background:none;font-size:12px;color:var(--muted);padding:4px 6px;border-radius:6px}
button.pin:hover{color:var(--ink);background:var(--soft)}
.pin.on{color:var(--accent);font-weight:500}
/* 统计页：极简扁平。层级 = 页标题 > 累计花费 > 四个关键数 > 分区标题 > 小标题 > 数据 */
.st-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.st-head h1{font-size:24px}
.st-theme{display:inline-flex;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:12px;padding:5px 10px;border-radius:99px;background:var(--soft)}
.st-theme i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.st-theme span{margin-left:5px}
.st-summary{display:grid;gap:22px;padding-bottom:28px}
@media (min-width:760px){.st-summary{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);align-items:end}}
.st-cap{display:block;font-size:13px;color:var(--muted)}
.st-total strong{display:block;font:650 44px/1.05 var(--num);letter-spacing:-.02em;margin:6px 0 8px;overflow-wrap:anywhere}
.st-sub{font-size:13px;color:var(--muted)}
.st-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 16px;margin:0}

.st-kpis>div{min-width:0}
.st-kpis dt{font-size:12px;color:var(--muted)}
.st-kpis dd{margin:2px 0 0;font:600 26px/1.2 var(--num)}
.st-kpis dd small{font:500 12px var(--sans);color:var(--muted);margin-left:3px}
.st-kpis em{display:block;font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.st-sec{border-top:1px solid var(--line);padding-block:26px 30px}
.st-sec>h2{font-size:17px;font-weight:600;margin:0 0 18px;display:flex;align-items:baseline;gap:10px}
.st-sec>h2 span{font-size:12px;font-weight:400;color:var(--muted)}
.sb-cols{display:grid;gap:30px}
@media (min-width:860px){.sb-cols{grid-template-columns:1fr 1fr;gap:30px 48px}.sb-cols.three{grid-template-columns:1.2fr 1fr 1fr}}
.sb{min-width:0}
.sb-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;min-height:28px}
.sb-head h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--ink)}
.sb-head h3 i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.sb-head>span{font-size:12px;color:var(--muted)}
.sb-bars{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.sb-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.sb-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-name em{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.sb-val{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.sb-val b{color:var(--ink);font-weight:600;font-size:14px}
.sb-dim{color:var(--muted);margin-left:10px;font-size:12px}
.sb-track{height:4px;border-radius:99px;background:var(--soft);overflow:hidden}
.sb-track i{display:block;height:100%;border-radius:99px;background:var(--c)}
.sb-more{margin-top:10px;border:0;background:none;color:var(--muted);font-size:13px;padding:4px 0}
.sb-more:hover{color:var(--ink)}
.sb-empty{margin:0;color:var(--muted);font-size:13px;padding:6px 0}
.sb-foot{margin:10px 0 0;font-size:12px;color:var(--muted)}
.sb-seg{display:inline-flex;background:var(--soft);border-radius:7px;padding:2px}
.sb-seg button{border:0;background:none;padding:3px 10px;border-radius:5px;font-size:12px;color:var(--muted)}
.sb-seg button.on{background:var(--bg);color:var(--ink);font-weight:500}
.sb-years{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.sb-years button{border:0;background:none;padding:2px 8px;border-radius:5px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sb-years button.on{color:var(--ink);font-weight:600;background:var(--soft)}
.sb-figure{margin:0 0 12px;display:flex;align-items:baseline;gap:8px}
.sb-figure b{font:600 22px var(--num)}
.sb-figure span{font-size:12px;color:var(--muted)}
.st .mbars{height:150px;background-image:none;border-bottom:1px solid var(--line-2)}
.st .mbar i{background:color-mix(in srgb,var(--p1) 40%,var(--soft));border-radius:2px 2px 0 0}
.st .mbar.peak i{background:var(--p1)}
.st .mbar small{color:var(--muted);font-size:10.5px}
.st .mbar.peak small{color:var(--ink);font-weight:600}
.st .cell{color:var(--muted);border-radius:3px}
.st .cell.l1{background:color-mix(in srgb,var(--p2) 22%,var(--soft));color:var(--ink)}
.st .cell.l2{background:color-mix(in srgb,var(--p2) 45%,var(--soft));color:var(--ink)}
.st .cell.l3{background:color-mix(in srgb,var(--p2) 72%,var(--soft));color:var(--p2-ink)}
.st .cell.l4{background:var(--p2);color:var(--p2-ink);font-weight:600}
.st .heat-legend .cell{color:transparent}
.sb-stack{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:14px}
.sb-stack i{display:block;background:var(--c);min-width:3px}
.sb-legend{list-style:none;margin:0;padding:0;display:grid;gap:8px;flex:1;min-width:150px}
.sb-legend li{display:flex;align-items:center;gap:8px;font-size:13px}
.sb-legend i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.sb-legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-legend b{font-weight:600;font-variant-numeric:tabular-nums}
.sb-legend em{font-style:normal;color:var(--muted);font-size:12px;width:3em;text-align:right;font-variant-numeric:tabular-nums}
.sb-donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.sb-donut{width:120px;height:120px;flex:none}
.sb-top{list-style:none;margin:0;padding:0}
.sb-top a{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.sb-top li:last-child a{border-bottom:0}
.sb-rank{width:18px;font:600 13px var(--num);color:var(--p8);flex:none;text-align:center}
.sb-top li:first-child .sb-rank{color:var(--ink)}
.sb-top-name{flex:1;min-width:0;display:grid;gap:3px}
.sb-t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-t2{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);opacity:.7;min-width:0;white-space:nowrap;overflow:hidden}
.sb-t3{font-size:11px;line-height:17px;padding:0 6px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap}
.sb-top b{font-weight:600;font-size:14px}
/* 设置：主题 */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme-opt{border:2px solid transparent;border-radius:10px;background:var(--bg);position:relative}
.theme-pick{border:0;background:none;padding:10px;text-align:left;display:grid;gap:8px;width:100%}
.theme-del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--soft);color:var(--muted);font-size:15px;line-height:24px;padding:0}
.theme-del:hover{color:var(--danger)}
.theme-add{border:1.5px dashed var(--line-2);border-radius:10px;display:grid;place-items:center;align-content:center;gap:2px;min-height:86px;color:var(--muted);font-size:13px;cursor:pointer}
.theme-add b{font-size:22px;font-weight:300;line-height:1}
.theme-add:hover{border-color:var(--ink);color:var(--ink)}
.theme-opt.on{border-color:var(--ink)}
.theme-opt .strip{display:flex;height:22px;border-radius:5px;overflow:hidden}
.theme-opt .strip i{flex:1;background:var(--c)}
.theme-opt b{font-size:14px;font-weight:600;display:block}
.theme-opt small{font-size:11px;color:var(--muted)}
.theme-names{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.theme-names span{display:inline-flex;align-items:center;gap:4px}
.theme-names i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.sync:hover{background:var(--soft)}
.sync[data-state=off]::before{background:var(--line-2)}
.sync[data-state=ok]::before{background:#2f9e6e}
.sync-row{grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:14px}
.sync-row h2{margin-bottom:2px}
.sync-pill{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2)}
.sync-pill i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.sync-pill[data-state=ok]{background:color-mix(in srgb,#2f9e6e 13%,var(--bg));color:color-mix(in srgb,#2f9e6e 85%,var(--ink));box-shadow:inset 0 0 0 1px color-mix(in srgb,#2f9e6e 40%,transparent)}
.sync-pill[data-state=ok] i{background:#2f9e6e}
.sync-pill[data-state=busy] i{background:var(--transit)}
.sync-status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 14px;border-radius:10px;background:var(--soft);font-size:14px}
.sync-status em{font-style:normal;color:var(--muted);font-size:13px}
.sync-status small{flex-basis:100%;color:var(--muted);font-size:12px}
.sync-dot{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.sync-dot.on{background:#2f9e6e;box-shadow:0 0 0 3px color-mix(in srgb,#2f9e6e 22%,transparent)}
.sync-checks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.sync-checks li{display:flex;gap:8px;align-items:flex-start}
.sync-checks li i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;flex:none;background:var(--muted)}
.sync-checks li.ok i{background:#2f9e6e}.sync-checks li.bad i{background:var(--danger)}
.install-info{display:flex;gap:12px;align-items:center;min-width:0}
.install-logo{width:44px;height:44px;border-radius:11px;object-fit:cover;flex:none;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.install-done{font-size:13px;color:#2f9e6e;font-weight:500;white-space:nowrap}
.install-steps{margin:14px 0 0;padding-left:20px;display:grid;gap:8px;font-size:14px;line-height:1.6}
/* 设置：二级分组（同步与设备 / 个性化 / 记账与数据 / 安全与隐私），组内是三级的功能卡片 */
.set-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:-12px;position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:8px 0}
.set-nav button{flex:none;border:0;background:var(--soft);color:var(--muted);padding:5px 12px;border-radius:99px;font-size:13px}
.set-nav button:hover{color:var(--ink)}
.set-group{display:grid;gap:10px;scroll-margin-top:110px}
.set-group-head h2{font-size:17px;font-weight:600}
.set-group-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.set-group-body{display:grid;gap:1px;background:var(--line);border-radius:12px;overflow:hidden}
.set-group-body>.set-card{border-radius:0}
.set-group-body>.set-card h2{font-size:15px}
.danger-card h2{color:var(--danger)}
/* 设置：品牌与实时汇率 */
.brand-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-preview{width:56px;height:56px;border-radius:12px;background:var(--bg);display:grid;place-items:center;overflow:hidden;flex:none}
.logo-preview img{width:100%;height:100%;object-fit:cover}
.req{margin:0;padding-left:18px;color:var(--muted);font-size:12px;display:grid;gap:2px}
.live{display:grid;gap:8px}
.live-table{width:100%;border-collapse:collapse;font-size:13px}
.live-table th{text-align:left;font-weight:500;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line-2)}
.live-table td{padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.live-table td:last-child,.live-table th:last-child{text-align:right}
.net-btn{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.net-btn i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.net-btn.on{color:color-mix(in srgb,#2f9e6e 85%,var(--ink));background:color-mix(in srgb,#2f9e6e 12%,var(--bg))}
.net-btn.on i{background:#2f9e6e;box-shadow:0 0 0 3px color-mix(in srgb,#2f9e6e 22%,transparent)}
.rate-q{white-space:nowrap}
.live-table td:first-child{white-space:nowrap}
.rate-q a{font-size:12px;margin-right:8px;text-decoration:none}
.diff{font-size:11px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border:0;background:none;padding:4px 8px;border-radius:99px;cursor:pointer}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:#3aa17e}
.sync[data-state=busy]::before{background:var(--transit)}
.sync[data-state=error]::before{background:var(--danger)}
.link-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.link-box code{flex:1;min-width:0;font-size:12px;background:var(--bg);padding:8px 10px;border-radius:6px;overflow-wrap:anywhere;user-select:all}
.steps{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:grid;gap:3px}
.brand-img{width:28px;height:28px;border-radius:7px;object-fit:cover}
.lock-logo-img{width:96px;height:96px;border-radius:22px;object-fit:cover;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* 根据底色深浅决定文字用白色还是深色 */
function textOn(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#fff';
  const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const L = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  return L > 0.66 ? '#2a2a30' : '#fff';
}

/* 字数显示：5 → 5W字；3000（字）→ 3000字 */
const wordsText = b => b && b.words && b.words.n ? (b.words.unit === 'z' ? `${b.words.n}字` : `${b.words.n}W字`) : '';
/* 星级（支持半星）：每颗星 = 灰色底 + 金色部分（0 / 50% / 100%） */
const halfRound = v => Math.round((Number(v) || 0) * 2) / 2;
const fillOf = (v, n) => v >= n ? 100 : v >= n - 0.5 ? 50 : 0;
function starsInner(rating, act) {
  const r = halfRound(rating);
  return [1, 2, 3, 4, 5].map(n => `<span class="star"><span class="star-bg">${STAR}</span><span class="star-fg" style="width:${fillOf(r, n)}%">${STAR}</span>
    <button type="button" class="star-half l" ${act} data-n="${n - 0.5}" aria-label="${n - 0.5} 星"></button><button type="button" class="star-half r" ${act} data-n="${n}" aria-label="${n} 星"></button></span>`).join('');
}
function fillStars(box, v) { $$('.star-fg', box).forEach((f, i) => { f.style.width = fillOf(v, i + 1) + '%'; }); }
/* 电脑上鼠标悬停时预览分数，移开后恢复 */
document.addEventListener('pointerover', e => { const h = e.target.closest && e.target.closest('.stars .star-half'); if (h && e.pointerType === 'mouse') fillStars(h.closest('.stars'), +h.dataset.n); });
document.addEventListener('pointerout', e => { const box = e.target.closest && e.target.closest('.stars'); if (box && !box.contains(e.relatedTarget)) fillStars(box, +box.dataset.rating || 0); });
const qtyOf = b => Math.max(1, parseInt(b && b.qty, 10) || 1);
/* 单价（每本）：只做记录，不参与总价计算。总价永远 = 支付明细各项相加 */

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }
function hashStr(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

/* LOGO 处理：裁成正方形，缩放到 256×256 PNG；SVG 原样保存 */
function processLogo(file) {
  return new Promise((res, rej) => {
    const okTypes = ['image/png', 'image/jpeg', 'image/webp', 'image/gif', 'image/svg+xml'];
    if (!okTypes.includes(file.type)) return rej(new Error('只支持 PNG、JPG、WebP、GIF 或 SVG 格式'));
    if (file.size > 2 * 1024 * 1024) return rej(new Error('图片超过 2 MB，请压缩后再上传'));
    if (file.type === 'image/svg+xml') {
      if (file.size > 200 * 1024) return rej(new Error('SVG 文件请控制在 200 KB 以内'));
      const r = new FileReader(); r.onload = () => res({src: r.result}); r.onerror = () => rej(new Error('读不了这个文件')); r.readAsDataURL(file); return;
    }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight; URL.revokeObjectURL(url);
      if (Math.min(w, h) < 64) return rej(new Error(`图片太小（${w}×${h}），至少需要 64×64 像素`));
      const s = Math.min(w, h), out = 256, c = document.createElement('canvas'); c.width = c.height = out;
      c.getContext('2d').drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, out, out);
      res({src: c.toDataURL('image/png'), warn: w !== h ? '图片不是正方形，已自动裁切中间部分' : ''});
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(/heic|heif/i.test(file.type + file.name) ? '这个浏览器读不了 HEIC 格式的照片，请在相机设置里改成“兼容性最佳”，或先截图再上传' : '读不了这张图片，请换一张 JPG 或 PNG 试试')); };
    img.src = url;
  });
}

/* SHA-256 */
const ror = (x, n) => (x >>> n) | (x << (32 - n));
const SHA_P = (() => { const p = []; for (let n = 2; p.length < 64; n++) if (p.every(q => n % q)) p.push(n); return p; })();
function sha256(str) {
  const frac = x => ((x - Math.floor(x)) * 4294967296) >>> 0;
  const K = SHA_P.map(p => frac(Math.cbrt(p)));
  let H = SHA_P.slice(0, 8).map(p => frac(Math.sqrt(p)));
  const b = new TextEncoder().encode(str), l = b.length, total = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(b); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(total - 4, (l * 8) >>> 0); dv.setUint32(total - 8, Math.floor(l * 8 / 4294967296));
  const W = new Uint32Array(64);
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) { const a = W[i - 15], c = W[i - 2]; W[i] = (W[i - 16] + (ror(a, 7) ^ ror(a, 18) ^ (a >>> 3)) + W[i - 7] + (ror(c, 17) ^ ror(c, 19) ^ (c >>> 10))) >>> 0; }
    let [a, bb, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) >>> 0;
      const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = bb; bb = a; a = (t1 + t2) >>> 0;
    }
    H = [a, bb, c, d, e, f, g, h].map((v, i) => (v + H[i]) >>> 0);
  }
  return H.map(v => v.toString(16).padStart(8, '0')).join('');
}

/* ================= IndexedDB ================= */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no-idb'));
      const r = indexedDB.open('doujin-shelf', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        ['ips', 'books'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath: 'id'}); });
        ['meta', 'outbox', 'imgcache'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); });   // outbox = 待同步队列，imgcache = 云端图片的本机缓存
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  run(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode), req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all: s => DB.run(s, 'readonly', st => st.getAll()),
  keys: s => DB.run(s, 'readonly', st => st.getAllKeys()),
  get: (s, k) => DB.run(s, 'readonly', st => st.get(k)),

  del: (s, k) => DB.run(s, 'readwrite', st => st.delete(k)),

/* ================= 存储层 =================

function dataUrlToBlob(u) {

function loadScript(src) {

  const url = String(c.supabaseUrl || '').trim().replace(/\/+$/, '').replace(/\/(rest|auth)\/v1.*$/i, '');
  const key = String(c.supabaseKey || '').trim();
  return /^https:\/\/.+/.test(url) && key ? {supabaseUrl: url, supabaseKey: key} : null;

async function claudeAdapter() {

  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  const id = db && user ? await user.id() : null;
  if (!db || !id) return null;
  const [assets, downloads] = await Promise.all([claude.use('assets'), claude.use('downloads')]);
  const col = db.collection('data/users/' + id);

  return {

    async put(id, body) { await col.doc(id).set(body); },
    async del(id) { await col.doc(id).delete(); },

    async sign() {},

}

const SETUP_SQL = "-- =====================================================================\n--  Doumi · Supabase 初始化脚本（安全版）\n--\n--  用法：Supabase 后台 → SQL Editor → New query → 粘贴全部内容 → Run\n--\n--  这个脚本只\"新建\"、不\"删除\"：\n--    · 不删除任何表、数据、文件或权限规则\n--    · 已经存在的东西会自动跳过，所以重复运行也不会出错、不会覆盖\n--    · 全部步骤放在一个事务里：中途任何一步出错，整份脚本都不会生效\n--  运行完成后，最下面会显示一张\"检查结果\"表，每一项都应该是 true。\n-- =====================================================================\n\nbegin;\n\n-- ---------------------------------------------------------------------\n-- 第 1 步：建数据表\n--   每一行是一个用户的一条记录：一个 IP、一本本子或一项设置。\n--   user_id  这行数据属于谁（默认就是当前登录的用户）\n--   doc_id   记录编号，例如 ip_xxx、book_xxx、meta_rates\n--   body     记录内容（JSON）\n--   用户账号被删除时，他的记录会随之删除（on delete cascade）。\n-- ---------------------------------------------------------------------\ncreate table if not exists public.shelf_docs (\n  user_id    uuid        not null default auth.uid()\n                         references auth.users (id) on delete cascade,\n  doc_id     text        not null\n                         check (doc_id ~ '^(ip|book|meta)_[A-Za-z0-9_.:-]{1,120}$'),\n  body       jsonb       not null\n                         check (jsonb_typeof(body) = 'object'),\n  updated_at timestamptz not null default now(),\n  primary key (user_id, doc_id)\n);\n\ncomment on table public.shelf_docs is 'Doumi：每个用户的 IP、本子和设置';\n\n-- ---------------------------------------------------------------------\n-- 第 2 步：开启行级权限（RLS）\n--   开启后，没有规则允许的读写一律被拒绝；\n--   未登录的访客（anon）没有任何规则，所以什么都读不到、写不了。\n-- ---------------------------------------------------------------------\nalter table public.shelf_docs enable row level security;\n\n-- ---------------------------------------------------------------------\n-- 第 3 步：建图片存储桶 covers\n--   private：图片不公开，只能凭登录身份换取临时访问地址\n--   单张最大 10 MB，只接受常见图片格式\n--   （如果 covers 已经存在，这一步会跳过，不改动原有设置）\n-- ---------------------------------------------------------------------\ninsert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types)\nvalues (\n  'covers', 'covers', false, 10485760,\n  array['image/jpeg', 'image/png', 'image/webp', 'image/gif', 'image/svg+xml']\n)\non conflict (id) do nothing;\n\n-- ---------------------------------------------------------------------\n-- 第 4 步：权限规则——\"每个人只能读写自己的东西\"\n--   数据表：user_id 必须等于当前登录用户\n--   图片：只能放在、读取、删除以自己用户 id 命名的文件夹里\n--   规则已存在（同名）就跳过，不会删除或覆盖。\n-- ---------------------------------------------------------------------\ndo $$\ndeclare\n  r record;\nbegin\n  for r in\n    select * from (values\n      -- 表所在模式, 表名,       规则名,                   操作,     条件\n      ('public',  'shelf_docs', 'shelf: read own',     'select', 'using (auth.uid() = user_id)'),\n      ('public',  'shelf_docs', 'shelf: insert own',   'insert', 'with check (auth.uid() = user_id)'),\n      ('public',  'shelf_docs', 'shelf: update own',   'update', 'using (auth.uid() = user_id) with check (auth.uid() = user_id)'),\n      ('public',  'shelf_docs', 'shelf: delete own',   'delete', 'using (auth.uid() = user_id)'),\n      ('storage', 'objects',    'covers: read own',    'select', 'using (bucket_id = ''covers'' and (storage.foldername(name))[1] = auth.uid()::text)'),\n      ('storage', 'objects',    'covers: upload own',  'insert', 'with check (bucket_id = ''covers'' and (storage.foldername(name))[1] = auth.uid()::text)'),\n      ('storage', 'objects',    'covers: delete own',  'delete', 'using (bucket_id = ''covers'' and (storage.foldername(name))[1] = auth.uid()::text)')\n    ) as t (schema_name, table_name, policy_name, command, rule)\n  loop\n    if not exists (\n      select 1 from pg_policies\n      where schemaname = r.schema_name\n        and tablename  = r.table_name\n        and policyname = r.policy_name\n    ) then\n      execute format(\n        'create policy %I on %I.%I for %s to authenticated %s',\n        r.policy_name, r.schema_name, r.table_name, r.command, r.rule\n      );\n    end if;\n  end loop;\nend\n$$;\n\n-- ---------------------------------------------------------------------\n-- 第 5 步：开启实时同步\n--   一台设备改了数据，其他设备马上收到通知（仍然受第 4 步的权限限制）。\n--   已经开启过就跳过。\n-- ---------------------------------------------------------------------\ndo $$\nbegin\n  if not exists (\n    select 1 from pg_publication_tables\n    where pubname = 'supabase_realtime'\n      and schemaname = 'public'\n      and tablename = 'shelf_docs'\n  ) then\n    alter publication supabase_realtime add table public.shelf_docs;\n  end if;\nend\n$$;\n\ncommit;\n\n-- ---------------------------------------------------------------------\n-- 第 6 步：检查结果（只读，不改动任何东西）\n--   每一项的\"结果\"都应该是 true。\n-- ---------------------------------------------------------------------\nselect '1. 数据表 shelf_docs 已建好'    as \"检查项\", to_regclass('public.shelf_docs') is not null as \"结果\"\nunion all\nselect '2. 数据表已开启行级权限',\n       coalesce((select relrowsecurity from pg_class where oid = to_regclass('public.shelf_docs')), false)\nunion all\nselect '3. 数据表权限规则 4 条',\n       (select count(*) from pg_policies where schemaname = 'public' and tablename = 'shelf_docs' and policyname like 'shelf: %') = 4\nunion all\nselect '4. 图片桶 covers 已建好且不公开',\n       exists (select 1 from storage.buckets where id = 'covers' and public = false)\nunion all\nselect '5. 图片权限规则 3 条',\n       (select count(*) from pg_policies where schemaname = 'storage' and tablename = 'objects' and policyname like 'covers: %') = 3\nunion all\nselect '6. 实时同步已开启',\n       exists (select 1 from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename = 'shelf_docs');\n";
/* ================= Supabase 同步（本地优先） =================
   · 所有修改先存到本机 IndexedDB（关掉再打开也不会丢），同时记进“待同步”队列
   · 连上 Supabase 并登录后：先把队列推上去，再把云端最新内容拉下来
   · 断网时照常使用；网络恢复、切回页面、其他设备有改动时会自动再同步
   · 图片：上传到 Supabase 的 covers 图片桶，同时在本机留一份缓存，离线也能看 */
const SYNC_META = ['pw', 'rates', 'brand', 'startView', 'theme', 'themes'];   // 会同步的设置；草稿、当前视图等只留在本机
const DOC_RE = /^(ip|book|meta)_[A-Za-z0-9_.:-]{1,120}$/;   // 与 setup.sql 里 doc_id 的检查规则一致
function sbFail(error) {   // 把 Supabase 的报错翻译成能看懂的话
  if (!error) return;
  const m = String(error.message || ''), c = String(error.code || ''), st = String(error.statusCode || error.status || '');
  let userMsg = '';
  if (c === '42P01' || c === 'PGRST205' || /does not exist|Could not find the table/i.test(m)) userMsg = '数据库还没建表：请复制建表 SQL，在 Supabase 的 SQL Editor 里运行';
  else if (/Bucket not found/i.test(m)) userMsg = '找不到图片桶 covers：请复制建表 SQL 在 Supabase 里运行';
  else if (c === '23514') userMsg = '有一条记录格式不符合数据库规则，已跳过';
  else if (c === '42501' || /row-level security|violates.*policy|Unauthorized/i.test(m) || st === '403') userMsg = '没有写入权限：请确认已登录，并且建表 SQL 已完整运行';
  else if (/mime type|invalid_mime/i.test(m) || st === '415') userMsg = '有一张图片格式不支持（只支持 JPG、PNG、WebP、GIF、SVG）';
  else if (/maximum allowed size|too large|Payload too large/i.test(m) || st === '413') userMsg = '有一张图片超过 10 MB';
  else if (/JWT|token.*expired|refresh token/i.test(m)) userMsg = '登录已过期，请在同步设置里重新登录';
  else if (/Failed to fetch|NetworkError|network|Load failed/i.test(m)) userMsg = '连不上 Supabase，请检查网络';
  throw Object.assign(new Error(m || 'Supabase error'), {code: c || st || 'sb', userMsg});
}
const Sync = {
  cfg: null, client: null, user: null, state: 'off', msg: '', lastAt: 0, busy: false, again: false, timer: null, channel: null,
  configured() { return !!(this.cfg && this.cfg.supabaseUrl && this.cfg.supabaseKey); },
  set(state, msg) {

    if (el) {
      el.hidden = !this.configured() && state === 'off';
      el.dataset.state = {ok: 'ok', busy: 'busy'}[state] || 'off';
      el.textContent = {ok: '已同步', busy: '同步中…', login: '未登录', offline: '离线 · 已存本机', error: '未同步', off: '未连接'}[state] || '未同步';
      el.title = this.msg || el.textContent;
    }
    $$('[data-sync-pill]').forEach(p => { p.dataset.state = el ? el.dataset.state : 'off'; p.querySelector('span').textContent = this.label(); });
    const box = document.getElementById('sync-status'); if (box) box.innerHTML = this.statusHtml();
  },
  label() {
    if (this.state === 'ok') return '已同步' + (this.lastAt ? ' · ' + new Date(this.lastAt).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}) : '');
    return {busy: '同步中…', login: '已连接 · 未登录', offline: '离线 · 内容已存本机', error: '未同步', off: '未连接云端'}[this.state] || '未同步';
  },
  statusHtml() {
    const on = this.state === 'ok' || this.state === 'busy';
    return `<span class="sync-dot ${on ? 'on' : ''}"></span><b>${esc(this.label())}</b>${this.user ? `<em>${esc(this.user.email || '')}</em>` : ''}${this.msg && !on ? `<small>${esc(this.msg)}</small>` : ''}`;
  },
  async lib() {

  },
  async boot() {
    try { this.cfg = (await DB.get('meta', 'sync')) || (await presetAllowed() ? normConfig(window.SHELF_CONFIG) : null); } catch { this.cfg = null; }
    this.lastAt = (await DB.get('meta', 'syncLast').catch(() => 0)) || 0;

    window.addEventListener('offline', () => this.set('offline'));

  async rows() {

  /* 第一次在这台设备上登录：把本机已有的内容和云端合并（较新的为准；设置项以云端为准） */

  async upload(dataUrl) {

  /* 推送待同步队列：新图片先上传，换成云端地址后写回本机，再写进云端表 */

    }
    let fixed = 0, lost = 0;
    for (const src of srcs) {
      if (have.has(src) || !src.startsWith('sb:' + this.user.id + '/')) continue;
      const du = (await DB.get('imgcache', src)) || (/^data:/.test(Store.urls[src] || '') ? Store.urls[src] : null);
      if (!du) { lost++; continue; }
      const blob = dataUrlToBlob(du);
      const {error} = await this.client.storage.from('covers').upload(src.slice(3), blob, {contentType: blob.type, upsert: true});
      if (error) lost++; else fixed++;
    }
    return {checked: srcs.size, fixed, lost};
  },
  /* 某张云端图片还没有地址时，攒一批一起去要（列表、详情、编辑页都会用到） */
  want(src) {
    if (!this.client || !this.user || Store.missing.has(src)) return;
    (this._want = this._want || new Set()).add(src);
    clearTimeout(this._wt);
    this._wt = setTimeout(async () => { const list = [...this._want]; this._want.clear(); try { await this.images(list); } catch {} }, 250);
  },
  /* 拉取云端：以云端为准覆盖本机（还在队列里没推上去的不动） */
  async pull() {
    const rows = await this.rows(), pending = new Set(await DB.keys('outbox'));
    const ips = [], books = [], meta = {}, srcs = [];
    rows.forEach(({doc_id: id, body: v}) => {
      if (!v) return;
      if (id.startsWith('ip_')) { ips.push(v); if (v.spineImg) srcs.push(v.spineImg); }
      else if (id.startsWith('book_')) { books.push(v); (v.images || []).forEach(x => srcs.push(x)); }
      else if (id.startsWith('meta_')) { meta[id.slice(5)] = v.v; if (id === 'meta_brand' && v.v && v.v.logo) srcs.push(v.v.logo); }
    });
    const replace = async (store, prefix, list) => {
      const keep = new Set(list.map(x => x.id));
      for (const k of await DB.keys(store)) if (!keep.has(k) && !pending.has(prefix + k)) await DB.del(store, k);
      const put = list.filter(x => !pending.has(prefix + x.id));
      if (put.length) await DB.putMany(store, put);
    };
    await replace('ips', 'ip_', ips); await replace('books', 'book_', books);
    const oldPw = await DB.get('meta', 'pw');
    for (const k of SYNC_META) {
      if (pending.has('meta_' + k)) continue;
      if (k in meta) { if (meta[k] === null || meta[k] === undefined) await DB.del('meta', k); else await DB.put('meta', meta[k], k); }
    }
    const newPw = await DB.get('meta', 'pw');
    if (oldPw && newPw && oldPw.hash !== newPw.hash) toast('已改用云端账号里的解锁密码');
    await this.images(srcs);
    if (Store.onRemote) await Store.onRemote();
  },
  /* 图片：有本机缓存就用缓存；没有就向云端要临时地址，并在后台存一份到本机 */
  async images(srcs) {
    const need = [...new Set(srcs.filter(s => s && s.startsWith('sb:') && !Store.urls[s]))];
    for (let i = 0; i < need.length; i += 100) {
      const {data, error} = await this.client.storage.from('covers').createSignedUrls(need.slice(i, i + 100).map(s => s.slice(3)), 7 * 24 * 3600);
      if (error || !data) continue;
      const got = new Set();
      data.forEach(d => { if (d.signedUrl && d.path) { got.add('sb:' + d.path); if (!Store.urls['sb:' + d.path]) { Store.urls['sb:' + d.path] = d.signedUrl; Store.urlsVer++; } } });
      need.slice(i, i + 100).forEach(x => { if (!got.has(x)) Store.missing.add(x); });   // 云端找不到这张图
    }
    Store.bumpUrls();
    need.forEach(async src => {
      const url = Store.urls[src]; if (!url || /^data:/.test(url)) return;
      try { const r = await fetch(url); if (!r.ok) return; const b = await r.blob();
        const du = await new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(b); });
        await DB.put('imgcache', du, src); } catch {}
    });
  },
  async signOut() { this.unsub(); try { await this.client.auth.signOut(); } catch {} this.user = null; await DB.del('meta', 'syncUser'); this.set('login'); },
  async disconnect() {
    this.unsub(); try { if (this.client) await this.client.auth.signOut(); } catch {}
    this.client = null; this.user = null; this.cfg = null;
    await DB.del('meta', 'sync'); await DB.del('meta', 'syncUser'); await DB.clear('outbox');
    this.set('off');
  },
};
/* 记录待同步的修改（只在配置了云端同步时记录） */
function queueSync(id, op) {
  if (!Sync.configured() || !DOC_RE.test(id)) return;
  if (id.startsWith('meta_') && !SYNC_META.includes(id.slice(5))) return;
  DB.put('outbox', {op, t: Date.now() + Math.random()}, id).then(() => Sync.soon()).catch(() => {});
}

const Store = {
  kind: 'local', remote: null, cache: {ips: new Map(), books: new Map(), meta: {}}, pending: 0, onRemote: null, urls: {}, urlsVer: 0, missing: new Set(),
  bumpUrls() { this.urlsVer++; window.dispatchEvent(new Event('doumi-urls')); if (unlocked && this.onRemote) this.onRemote(); },
  get cloud() { return this.remote; },
  async loadImgCache() {
    try {
      const [keys, vals] = await Promise.all([DB.keys('imgcache'), DB.all('imgcache')]);
      let n = 0; keys.forEach((k, i) => { if (vals[i] && !/^data:/.test(this.urls[k] || '')) { this.urls[k] = vals[i]; n++; } });
      if (n) this.bumpUrls();
    } catch {}
  },
  async init() {
    try { this.remote = await claudeAdapter(); } catch { this.remote = null; }
    if (this.remote) {
      this.kind = this.remote.kind;
      await this.absorb(await this.remote.load());
      this.remote.subscribe(docs => this.absorb(docs, true));
    }
    try { if (!DB.db) await DB.open(); }
    catch (e) { if (!this.remote) throw e; }   // 云端版里本地存储只用于草稿
    if (this.remote) { setSync('ok'); return; }
    this.loadImgCache();   // 在后台读取本机缓存的云端图片，不拖慢打开速度
    Sync.boot();   // 后台连接 Supabase，不阻塞打开
  },
  async absorb(docs, remote) {
    const ips = new Map(), books = new Map(), meta = {}, srcs = [];
    docs.forEach(({id, body: v}) => {
      if (!v) return;
      if (id.startsWith('ip_')) { ips.set(v.id, clone(v)); if (v.spineImg) srcs.push(v.spineImg); }
      else if (id.startsWith('book_')) { books.set(v.id, clone(v)); (v.images || []).forEach(x => srcs.push(x)); }
      else if (id.startsWith('meta_')) { meta[id.slice(5)] = v.v; if (id === 'meta_brand' && v.v && v.v.logo) srcs.push(v.v.logo); }
    });
    try { await this.remote.sign(srcs); } catch {}
    this.cache = {ips, books, meta};
    if (remote && this.onRemote) this.onRemote();
  },
  docId: (s, k) => s === 'meta' ? 'meta_' + k : (s === 'ips' ? 'ip_' : 'book_') + k,
  async prepare(s, v, k) {   // 把新图片上传，换成云端地址
    if (s === 'books' && Array.isArray(v.images)) {
      for (let i = 0; i < v.images.length; i++) if (/^data:/.test(v.images[i])) v.images[i] = await this.remote.upload(v.images[i]);
    }
    if (s === 'meta' && k === 'brand' && v && /^data:/.test(v.logo || '')) v.logo = await this.remote.upload(v.logo);
    if (s === 'ips' && v && /^data:/.test(v.spineImg || '')) v.spineImg = await this.remote.upload(v.spineImg);
  },
  async write(fn) { this.pending++; setSync('busy'); try { return await fn(); } catch (e) { setSync('error'); throw e; } finally { this.pending--; if (this.pending === 0 && document.getElementById('sync').dataset.state !== 'error') setSync('ok'); } },
  async all(s) { if (!this.remote) return DB.all(s); return [...this.cache[s].values()].map(clone); },
  async get(s, k) { if (!this.remote) return DB.get(s, k); return s === 'meta' ? clone(this.cache.meta[k]) : clone(this.cache[s].get(k)); },
  imagesOf(s, k, v) {   // 一条记录引用的云端图片
    if (s === 'books') return ((v || this.cache.books.get(k) || {}).images || []).slice();
    if (s === 'meta' && k === 'brand') { const b = v || this.cache.meta.brand; return b && b.logo ? [b.logo] : []; }
    if (s === 'ips') { const i = v || this.cache.ips.get(k); return i && i.spineImg ? [i.spineImg] : []; }
    return [];
  },
  async cleanup(srcs) { if (srcs.length && this.remote.remove) { try { await this.remote.remove(srcs); } catch {} } },
  async put(s, v, k) {
    if (!this.remote) {
      if (s !== 'meta' && v && typeof v === 'object') v._u = Date.now();
      await DB.put(s, v, k); queueSync(this.docId(s, s === 'meta' ? k : v.id), 'put'); return;
    }
    const key = s === 'meta' ? k : v.id, before = this.imagesOf(s, key);
    return this.write(async () => {
      await this.prepare(s, v, k);
      const body = s === 'meta' ? {v: v === undefined ? null : JSON.parse(JSON.stringify(v))} : JSON.parse(JSON.stringify(v));
      await this.remote.put(this.docId(s, key), body);
      if (s === 'meta') this.cache.meta[k] = clone(v); else this.cache[s].set(key, clone(v));
      const now = new Set(this.imagesOf(s, key, v));
      await this.cleanup(before.filter(x => !now.has(x)));
    });
  },
  async del(s, k) {
    if (!this.remote) { await DB.del(s, k); queueSync(this.docId(s, k), 'del'); return; }
    const before = this.imagesOf(s, k);
    return this.write(async () => {
      await this.remote.del(this.docId(s, k));
      if (s === 'meta') delete this.cache.meta[k]; else this.cache[s].delete(k);
      await this.cleanup(before);
    });
  },
  async putMany(s, arr, progress) {
    if (!this.remote) { const t = Date.now(); arr.forEach(v => { v._u = v._u || t; }); await DB.putMany(s, arr); arr.forEach(v => queueSync(this.docId(s, v.id), 'put')); return; }
    let i = 0; for (const v of arr) { await this.put(s, v); if (progress) progress(++i, arr.length); }
  },
  async clear(s) {
    if (!this.remote) {
      const keys = await DB.keys(s); await DB.clear(s);
      keys.forEach(k => queueSync(this.docId(s, k), 'del')); return;
    }
    const keys = s === 'meta' ? Object.keys(this.cache.meta) : [...this.cache[s].keys()];
    for (const k of keys) await this.del(s, k);
  },
};

function authErr(e) {
  const m = (e && e.message) || '';
  if (/Invalid login credentials/i.test(m)) return '邮箱或密码不对';
  if (/Email not confirmed/i.test(m)) return '邮箱还没确认，请先去邮箱点确认链接';
  if (/already registered|already been registered/i.test(m)) return '这个邮箱已经注册过了，请直接登录';
  if (/Password should be at least/i.test(m)) return '账号密码至少 6 位';
  if (/rate limit|too many/i.test(m)) return '操作太频繁了，请稍后再试';
  if (/fetch|network/i.test(m)) return '连不上服务器，请检查网络';
  return m || '出错了，请再试一次';
}
function showRecovery(client) {
  openModal(`<div class="sheet-head"><h2>设置新的账号密码</h2></div>
    <form class="form" id="rc-form"><input class="input" type="password" id="rc-pw" placeholder="新密码（至少 6 位）" autocomplete="new-password">

/* ================= 存储容量 =================
   本子和图片存在浏览器的 IndexedDB 里（不是 localStorage，没有 5 MB 上限）。
   每张图裁剪后压到长边 1280 像素左右（约 150–250 KB），800 本、每本 2–3 张图约 300–500 MB，
   现代浏览器按磁盘剩余空间分配，够用；同时申请“持久存储”，避免空间紧张时被浏览器自动清理。 */
const BOOK_CAPACITY = 800, IMG_MAX = 1280, IMG_Q = 0.82;
async function askPersist() {
  try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch {}
}
async function storageHint() {
  const el = $('#storage-hint'); if (!el) return;
  const n = sum(S.books.map(qtyOf)), parts = [`已记录 ${n} 本（可放心存到 ${BOOK_CAPACITY} 本以上）`];
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const r = await navigator.storage.estimate(), mb = v => v >= 1024 ** 3 ? (v / 1024 ** 3).toFixed(1) + ' GB' : (v / 1048576).toFixed(1) + ' MB';
      if (r && r.usage) parts.push(`已用存储约 ${mb(r.usage)}${r.quota ? ` / 可用约 ${mb(r.quota)}` : ''}`);
      if (r && r.quota && r.usage / r.quota > 0.8) parts.push('空间快满了，建议导出备份，或开启云端同步');
    }
    if (navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()) parts.push('已开启持久存储');
  } catch {}
  if (document.body.contains(el)) el.textContent = parts.join(' · ');
}
const errMsg = e => (e && e.userMsg) || (e && e.code ? `云端操作失败（${e.code}），请检查网络后再试` : '操作失败：' + ((e && e.message) || e));
async function save(store, v) {

  catch (e) {
    const msg = e && e.userMsg ? e.userMsg : e && (e.name === 'QuotaExceededError' || e.code === 'quota_exceeded' || e.code === 'too_large') ? '存储空间不够了，删掉一些图片后再试'

}

/* 合集页：长按 / 按住拖动封面调整顺序（像手机桌面整理 App） */

/* 通用：长按 / 按住拖动排序。grid = 容器，sel = 可拖动的项，save(ids) = 松手后保存新顺序 */
function makeSortable(grid, sel, save, {padTop = 0} = {}) {
  const cards = () => $$(sel, grid);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPRING = 'cubic-bezier(.34,1.56,.64,1)';   // 带一点回弹的缓动 = Q 弹

    const r = card.getBoundingClientRect();
    const ghost = card.cloneNode(true); ghost.classList.add('drag-ghost');
    ghost.style.width = r.width + 'px'; ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
    document.body.appendChild(ghost);
    if (ghost.animate && !reduce) ghost.animate([{transform: 'scale(1) rotate(0)'}, {transform: 'scale(1.06) rotate(-1.5deg)'}], {duration: 220, easing: SPRING});
    card.classList.add('drag-src'); grid.classList.add('dragging');
    drag = {card, ghost, dx: x - r.left, dy: y - r.top, moved: false, raf: 0, x, y};
    sortBusy++;

  };
  // 只给看得见的卡片做位移动画：几百本时也不卡
  const flip = mutate => {
    const vh = window.innerHeight, list = cards().filter(c => c !== drag.card);
    const shown = list.filter(c => { const b = c.getBoundingClientRect(); return b.bottom > -40 && b.top < vh + 40; });
    const before = new Map(shown.map(c => [c, c.getBoundingClientRect()]));
    mutate();
    if (reduce) return;
    shown.forEach(c => {
      if (!c.animate) return;
      (c.getAnimations ? c.getAnimations() : []).forEach(a => a.cancel());
      const a = before.get(c), b = c.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
      if (!dx && !dy) return;
      c.animate([
        {transform: `translate(${dx}px,${dy}px) scale(1)`},
        {transform: `translate(${dx * 0.15}px,${dy * 0.15}px) scale(.94)`, offset: 0.35},
        {transform: 'translate(0,0) scale(1)'}

    });
  };
  // 用排版位置（不受动画影响）判断手指落在第几个位置，避免动画过程中来回跳
  const slotAt = (x, y, list) => {
    const g = grid.getBoundingClientRect(), px = x - g.left, py = y - g.top;

    if (!drag) return;
    drag.raf = 0;
    const {x, y} = drag;
    drag.ghost.style.left = (x - drag.dx) + 'px'; drag.ghost.style.top = (y - drag.dy) + 'px';
    const list = cards(), from = list.indexOf(drag.card), to = slotAt(x, y, list);
    if (from >= 0 && to >= 0 && to !== from) {
      const target = list[to];
      flip(() => grid.insertBefore(drag.card, to > from ? target.nextSibling : target));

    const land = () => {

      sweepGhosts();

    };

    else {

  });

  };
  const end = gone => { if (pending) { clearTimeout(pending.timer); pending = null; } finish(gone === true); };
  [...sortCtxs].forEach(c => { if (c.grid === grid || !document.body.contains(c.grid)) { c.end(true); sortCtxs.delete(c); } });   // 旧区域被替换：先收回它拖着的卡片
  sortCtxs.add({grid, move: onMove, end});

  grid.addEventListener('contextmenu', e => { if (drag || pending) e.preventDefault(); });
}

function costSummary(costs) {

  const foreign = [...by.keys()].some(c => c !== 'CNY');

}

/* ================= 统计 ================= */
/* ================= 统计配色主题 =================

const DEFAULT_THEME = {id: 'default', name: '默认', colors: ['#4e79a7', '#e08e45', '#59a14f', '#d1605e', '#8c6bb1', '#c9a227', '#3fa3b0', '#a0785a']};

let THEME = 'default';
const themeOf = id => USER_THEMES.find(t => t.id === id) || DEFAULT_THEME;
const rgbOf = hex => { const n = parseInt(String(hex).replace('#', ''), 16) || 0; return [n >> 16, (n >> 8) & 255, n & 255]; };
const hexOf = c => '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
function luminance([r, g, b]) { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); }

/* 图形颜色和背景的对比度至少 3:1；不够就往黑（浅色背景）或往白（深色背景）推 */
function rgbToHsl([r, g, b]) {

  if (mx === mn) return [0, 0, l];

const textOnHex = hex => contrastOf(rgbOf(hex), [255, 255, 255]) >= contrastOf(rgbOf(hex), [28, 30, 36]) ? '#fff' : '#1c1e24';
const themeColors = () => { const t = themeOf(THEME).colors.slice(0, 8); while (t.length < 8) t.push(DEFAULT_THEME.colors[t.length]); return t; };
const pal = i => fitColor(themeColors()[((i % 8) + 8) % 8], pageBg());

let statYear = null, statMetric = 'count', statAll = {ip: false, cp: false};
function sumBy(books, keyFn) {   // 按本数（含购买数量）汇总
  const m = new Map();
  books.forEach(b => (keyFn(b) || []).forEach(k => { const e = m.get(k) || {name: k, count: 0, cost: 0, titles: 0}; e.count += qtyOf(b); e.cost += bookTotal(b); e.titles++; m.set(k, e); }));

/* 书脊文字：拆成若干段，段与段之间留固定间距

const SW_RE = /([A-Za-z0-9\u00C0-\u024F!-\/:-@\[-`{-~×]+(?: +[A-Za-z0-9\u00C0-\u024F!-\/:-@\[-`{-~×]+)*)/;

/* 名字超出书脊高度时加 .clip（底部淡出），代替省略号 */
/* 小标题：色点 + 名称 + 右侧补充说明 */
const blockHead = (title, n, aside) => `<div class="sb-head"><h3><i style="--c:var(--p${n})"></i>${title}</h3>${aside ? `<span>${aside}</span>` : ''}</div>`;
function barRows(rows, {valFn, color, limit, moreKey}) {

function stackBar(rows, total, unitFn, off = 0) {

function donutSvg(rows, total) {
  const r = 54, C = 2 * Math.PI * r; let off = 0;

function timeBlocks(books) {
  const isDated = b => /^\d{4}-\d{2}/.test(b.buyDate || '');

  dated.forEach(b => { const k = b.buyDate.slice(0, 7); const e = ym.get(k) || {count: 0, cost: 0}; e.count += qtyOf(b); e.cost += bookTotal(b); ym.set(k, e); });

        ${v ? `<small>${fmtV(v)}</small>` : ''}<i class="${v ? '' : 'zero'}" style="height:calc((100% - 18px) * ${v / maxM})"></i></div>`; }).join('')}</div>

    </div>
    <div class="sb st-h">
      ${blockHead('时间方块', 2, '每格一个月，越深买得越多')}
      <div class="heat-scroll"><div class="heat">
        <span></span>${Array.from({length: 12}, (_, i) => `<span class="h">${i + 1}</span>`).join('')}

/* 购买时间线：年 → 月 → 这个月买的本子封面（3:4），左右滑动，打开时停在最近的月份 */

function renderStats() {
  const books = S.books;
  if (!books.length) {
    $('#view').innerHTML = `<div class="page-head"><div><h1>统计</h1></div></div><p class="sb-empty">书架上还没有本子，添加几本后这里会出现统计</p>`;

  const byIp = S.ips.map(ip => { const bs = books.filter(b => b.ipId === ip.id); return {name: ip.name, v: sum(bs.map(qtyOf)), cost: sum(bs.map(bookTotal))}; })
    .filter(x => x.v).sort((a, b) => b.v - a.v || b.cost - a.cost);

  const noCp = sum(books.filter(b => !splitCp(b.cp).length).map(qtyOf));

  const kinds = sumBy(books, b => [b.kind || '未填写']).map(x => ({...x, v: x.count}));
  const reads = sumBy(books, b => [b.read || '未标记']).map(x => ({...x, v: x.count}));
  const labMap = new Map();
  books.forEach(b => allCosts(b).forEach(x => { const k = normLabel(x.label) || '其他'; labMap.set(k, (labMap.get(k) || 0) + toCny(x)); }));

/* ================= 分享给朋友 =================
   分享链接带 ?share=1：对方打开时会忽略网站里 config.js 预填的 Supabase 信息，
   以“不连云端、空书架、还没设密码”的初始状态开始使用。你的书架、密码、同步设置都只在你自己的浏览器里，不会跟着链接过去。 */
let PRESET_OK = true;
async function presetAllowed() {
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('share') === '1') {
      await DB.put('meta', true, 'noPreset');   // 记住：这台设备以后也不用 config.js 里的预设
      q.delete('share'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
    }
    PRESET_OK = !(await DB.get('meta', 'noPreset'));
  } catch { PRESET_OK = true; }
  return PRESET_OK;
}
const siteUrl = () => location.origin + location.pathname.replace(/index\.html$/, '');
const shareLink = () => siteUrl() + '?share=1';
/* 分享卡片图 share-card.png 是事先生成好的静态文件（LOGO + Doumi + made by fs），网页头部的分享信息引用它 */
async function nativeShare() {   // 系统分享：发链接（网站的分享信息会让微信、QQ 等显示成卡片）
  try { await navigator.share({title: 'Doumi', text: 'Doumi · 你的同人本管理书架 · made by fs', url: shareLink()}); } catch {}
}

function shareCard() {
  if (Store.kind === 'claude') return '';

  return `<div class="set-card"><h2>分享给朋友</h2>

    <div class="row"><button class="btn primary small" type="button" data-act="share-copy">复制分享链接</button>${navigator.share ? '<button class="btn small" type="button" data-act="share-native">用其他 App 分享</button>' : ''}</div>`}
    ${preset ? '<p class="hint" style="margin:0;color:var(--danger)">提醒：网站的 config.js 里填了 Supabase 信息。分享链接已经会自动忽略它，但别人看网站源码时仍能看到。建议把 config.js 改回空白，只在自己的设备里填写。</p>' : ''}

/* ================= 清除缓存 =================
   本地缓存：离线网页文件（Service Worker）+ 云端图片在本机的副本（imgcache）
   在线缓存：云端图片的临时签名链接（内存里），清完重新向云端要
   不碰：本子、IP、设置、待同步队列，也不动 Supabase 里的任何数据 */
async function clearCaches() {
  const web = Store.kind !== 'claude';
  if (web && !navigator.onLine) return toast('请先联网再清除缓存，清除后需要重新下载网页');
  if (!(await confirmBox('清除这台设备上的网页缓存和图片缓存，并重新下载最新版本？本子数据和还没同步的修改不受影响。', '清除缓存'))) return;
  toast('正在清除缓存…');
  let keptImgs = false;
  try {
    if (DB.db) {
      const n = (await DB.keys('imgcache')).length;
      if (n && Sync.client && Sync.user) {
        await Sync.repairImages();               // 先确认图片都在云端，再删本机副本
        await DB.clear('imgcache');
      } else if (n) keptImgs = true;             // 没连云端时，本机副本是唯一能显示这些图的地方，保留
    }
  } catch { keptImgs = true; }
  Object.keys(Store.urls).forEach(k => { if (k.startsWith('sb:')) delete Store.urls[k]; });
  Store.missing.clear();
  try { if ('caches' in window) for (const k of await caches.keys()) await caches.delete(k); } catch {}
  try { if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.update(); } catch {}
  const msg = keptImgs ? '缓存已清除（没连云端同步，图片副本先保留）' : '缓存已清除，已重新加载最新版本';
  if (!web) { Store.bumpUrls(); return toast(msg.replace('，已重新加载最新版本', '')); }
  try { sessionStorage.setItem('doumi-toast', msg); } catch {}
  location.reload();
}

async function blobToDataUrl(path) {
  const r = await fetch(path); if (!r.ok) throw new Error(r.status);
  const b = await r.blob();
  return await new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(b); });
}

/* 实时汇率：先试 open.er-api.com，失败再试 frankfurter（后者没有新台币） */

/* 实时汇率：依次尝试几个免费的汇率接口（国内外都能访问的优先），都失败时用谷歌 / 必应查询 */
/* 实时汇率：同时向几个免费接口要数据，选“更新时间最新”的那一个。
   · Coinbase：实时报价（几分钟内更新）
   · 其余为日更数据：按国际标准时间（UTC）的日期发布，北京时间早上 8 点前看到的通常还是“前一天”的日期，这是正常的 */
const dayTs = d => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : 0; };
const RATE_SOURCES = [
  {name: 'Coinbase 实时报价', realtime: true, url: 'https://api.coinbase.com/v2/exchange-rates?currency=CNY',
    parse: j => j && j.data && j.data.rates ? {rates: numVals(j.data.rates), ts: Date.now()} : null},
  {name: 'open.er-api.com（日更）', url: 'https://open.er-api.com/v6/latest/CNY',
    parse: j => j && j.result === 'success' && j.rates ? {rates: j.rates, ts: (j.time_last_update_unix || 0) * 1000} : null},
  {name: 'currency-api（日更）', url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/cny.json',
    parse: j => j && j.cny ? {rates: upperKeys(j.cny), ts: dayTs(j.date), day: j.date} : null},
  {name: 'currency-api（日更 · 备用）', url: 'https://latest.currency-api.pages.dev/v1/currencies/cny.json',
    parse: j => j && j.cny ? {rates: upperKeys(j.cny), ts: dayTs(j.date), day: j.date} : null},
  {name: 'Frankfurter · 欧洲央行（工作日更新）', url: 'https://api.frankfurter.dev/v1/latest?base=CNY',
    parse: j => j && j.rates ? {rates: j.rates, ts: dayTs(j.date), day: j.date} : null},

async function fetchLiveRates() {

/* 从图片提取主要颜色（最多 n 个，去掉接近纯白/纯黑和相近的颜色） */
function extractPalette(src, n = 10, minDist = 46) {
  return new Promise(res => {
    if (!src) return res([]);
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const w = 64, h = Math.max(1, Math.round(64 * img.naturalHeight / img.naturalWidth));

        const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
        const d = x.getImageData(0, 0, w, h).data, bins = new Map();

          const e = bins.get(k) || {r: 0, g: 0, b: 0, n: 0}; e.r += d[i]; e.g += d[i + 1]; e.b += d[i + 2]; e.n++; bins.set(k, e);
        }
        const cols = [...bins.values()].map(e => ({r: e.r / e.n, g: e.g / e.n, b: e.b / e.n, n: e.n})).sort((a, b) => b.n - a.n);
        const out = [];
        for (const c of cols) {
          const mx = Math.max(c.r, c.g, c.b), mn = Math.min(c.r, c.g, c.b), l = (mx + mn) / 510;
          if (l > 0.975 || l < 0.03) continue;
          if (out.every(o => Math.hypot(o.r - c.r, o.g - c.g, o.b - c.b) > minDist)) out.push(c);
          if (out.length >= n) break;
        }
        res(out.map(c => '#' + [c.r, c.g, c.b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('')));
      } catch { res([]); }
    };
    img.onerror = () => res([]);
    img.src = src;
  });
}
